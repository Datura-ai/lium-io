name: Changed packages
description: >-
  Which packages the current event touches. One output per package, "true" or "false", so every
  test job can be skipped when its package is untouched while the aggregate check (tests-ok) still
  reports on every PR — a required status check that never reports blocks the merge button and
  stalls a merge queue. On a PR the diff is the PR's file list. On a merge-queue entry
  (merge_group) it is base_sha..head_sha, exactly the files the queued PR adds on top of main and
  the entries ahead of it. On a push to main it is before..after, the commits the push adds: the
  merged PR already ran its jobs, so main re-runs only the packages it changed (DAH-5201). Any other
  event (workflow_dispatch, a push whose before-commit is unknown) has no diff and selects every package. Documentation never selects a package: *.md and .gitignore files
  wherever they sit, and the root docs/ tree, are dropped from the file list before routing
  (isDoc), so a PR that only edits neurons/validators/README.md runs no tests and tests-ok still
  reports green — the tests exercise code, and none of those files is code. (A docs/ directory
  inside a package, e.g. neurons/executor/dstacktee/docs/, is not dropped: it is part of that
  package.) Of the rest, only four prefixes select
  anything: neurons/<pkg>/ selects that package; datura/ (the protocol package every neuron
  installs from a path) and .github/ (a router bug must not hide behind its own filter) select
  all four. lium_protocol/ (the validator↔backend wire package) selects protocol and
  validators (neurons/validators/tests/test_protocol_compat.py replays its recordings through
  the validator's models); neurons/executor/dstacktee/ (the files dstack measures into the CVM
  compose hash) also selects validators (tests/test_tdx_compose_hash_whitelist.py rebuilds the
  hash and checks the whitelist). Every other path — the root pyproject.toml and pdm.lock (dev tooling
  only), scripts/, contrib/, watchtower/, tests/ (an empty package) — selects nothing. A fifth
  output, e2e, is true when any package is or when e2e/ itself changed: the e2e stack builds
  every neuron, so it runs whenever one of them could have changed and skips (green, via
  tests-ok) on a PR that touches none. A file under a neuron's own tests/ directory does not select
  e2e: the stack runs e2e/tests, never those.

outputs:
  validators:
    value: ${{ steps.route.outputs.validators }}
  executor:
    value: ${{ steps.route.outputs.executor }}
  miners:
    value: ${{ steps.route.outputs.miners }}
  protocol:
    value: ${{ steps.route.outputs.protocol }}
  e2e:
    value: ${{ steps.route.outputs.e2e }}

runs:
  using: composite
  steps:
    - id: route
      uses: actions/github-script@v7
      with:
        script: |
          const PACKAGES = { validators: 'neurons/validators/', executor: 'neurons/executor/', miners: 'neurons/miners/', protocol: 'lium_protocol/' };
          // a change to any of these selects every package
          const SHARED = ['datura/', '.github/'];
          // a change to the wire package also runs the validator's compatibility test against it;
          // a change under dstacktee/ (the measured CVM files and dstack.py) runs the validator's
          // compose-hash whitelist test (tests/test_tdx_compose_hash_whitelist.py, DAH-3602)
          const ALSO = { validators: ['lium_protocol/', 'neurons/executor/dstacktee/'] };
          const isDoc = f => /\.md$|(^|\/)\.gitignore$|^docs\//.test(f);
          const touches = (files, pkg, prefix) =>
            files.some(f => f.startsWith(prefix)) || files.some(f => SHARED.some(s => f.startsWith(s)))
            || files.some(f => (ALSO[pkg] || []).some(s => f.startsWith(s)));

          let files = null, why = 'no diff for this event';
          const prNumber = context.payload.pull_request?.number;
          if (prNumber) {
            const listed = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner, repo: context.repo.repo, pull_number: prNumber, per_page: 100,
            });
            // a rename out of a package is still a change to that package
            files = listed.flatMap(f => [f.filename, f.previous_filename].filter(Boolean)).filter(f => !isDoc(f));
            why = `PR #${prNumber}: ${files.length} files`;
          } else {
            // merge group: base..head; push: before..after (all zeros on a new branch: no diff, every package)
            const mg = context.payload.merge_group;
            const [base, head] = mg ? [mg.base_sha, mg.head_sha]
              : context.eventName === 'push' && !/^0+$/.test(context.payload.before || '0') ? [context.payload.before, context.sha]
              : [null, null];
            // an unfetchable base (a commit gone from the remote) runs every package, never none
            if (base && await exec.exec('git', ['fetch', '--no-tags', '--depth=1', 'origin', base], { ignoreReturnCode: true }) === 0) {
              // the checkout is shallow at head; the base commit is all a diff needs
              // -z: NUL-separated, unquoted paths — with core.quotePath a name holding a byte >= 0x80, `"` or `\`
              // comes back quoted and would miss every prefix, silently skipping that package
              const { stdout } = await exec.getExecOutput('git', ['diff', '--name-only', '-z', '--no-renames', base, head]);
              files = stdout.split('\0').filter(f => f && !isDoc(f));
              why = `${context.eventName} ${base.slice(0, 7)}..${head.slice(0, 7)}: ${files.length} files`;
            }
          }

          const rows = [];
          // the stack never runs a neuron's own tests/, so a change there alone does not select e2e
          const e2eFiles = files && files.filter(f => !/^neurons\/[^/]+\/tests\//.test(f));
          let anyPackage = false;
          for (const [pkg, prefix] of Object.entries(PACKAGES)) {
            const changed = files ? touches(files, pkg, prefix) : true;
            anyPackage ||= e2eFiles ? touches(e2eFiles, pkg, prefix) : changed;
            core.setOutput(pkg, changed);
            rows.push([pkg, changed ? 'changed' : 'unchanged', why]);
          }
          // the e2e stack is built from every package: it runs when any of them did, or when e2e/ itself changed
          const e2e = anyPackage || (e2eFiles ? touches(e2eFiles, 'e2e', 'e2e/') : true);
          core.setOutput('e2e', e2e);
          rows.push(['e2e', e2e ? 'changed' : 'unchanged', why]);
          core.summary
            .addHeading('Route', 3)
            .addTable([[{data: 'package', header: true}, {data: 'result', header: true}, {data: 'why', header: true}], ...rows])
            .write();
