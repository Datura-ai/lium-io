name: "CD: Deploying Executor (dev) with Manual Trigger"

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # From main: the release repositories' `dev` tag, which the dev and staging stacks pull. From any
    # other branch: `dockerhub-push-dev` (no branch policy), whose Docker Hub ruleset covers only the
    # `-dev` repositories, so a branch never gets a token for a release image (.github/rulesets/README.md).
    environment: ${{ github.ref == 'refs/heads/main' && 'dockerhub-push' || 'dockerhub-push-dev' }}
    env:
      IMAGE_REPO_SUFFIX: ${{ github.ref != 'refs/heads/main' && '-dev' || '' }}
      TAG: "dev" 
      VALIDATOR_HOTKEY_SS58: "5DHgdomxxHSQf7neJWcagvGhTMKpqvKWwuprEaFF8C653qty"
      TARGET_FILE: "docker-compose.app.dev.yml"
      SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Make scripts executable
        run: |
          chmod +x neurons/executor/docker_build.sh
          chmod +x neurons/executor/docker_publish.sh
          chmod +x neurons/executor/docker_runner_build.sh
          chmod +x neurons/executor/docker_runner_publish.sh

      # Build before the login: the base images (python, docker) are public docker.io images, and once
      # the OIDC token is the docker.io credential every pull uses it. It covers only the daturaai push
      # repositories, so a build after the login fails with `insufficient scope`.
      - name: Build the executor image
        run: |
          cd neurons/executor
          source ./docker_build.sh
          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV

      - name: Log in to Docker Hub (OIDC, no stored token)
        uses: docker/login-action@v4   # >= 4.5.0 for Docker Hub OIDC
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
          # The exchanged token is the docker password for the rest of the job (default 300 s);
          # the pushes must finish inside it, so 30 min leaves room for a cold cache or a slow runner.
          DOCKERHUB_OIDC_EXPIREIN: "1800"
        with:
          username: daturaai

      - name: Publish the executor image
        run: |
          cd neurons/executor
          source ./docker_publish.sh
          echo "EXECUTOR_IMAGE_SHA256=${EXECUTOR_IMAGE_SHA256}" >> $GITHUB_ENV

      # The runner image needs the executor digest from the push above, so it is built between two
      # logins: logged out, it pulls docker:26-cli anonymously like the executor build.
      # No server argument: the login is stored under https://index.docker.io/v1/, and
      # `docker logout docker.io` leaves that entry in place.
      - name: Log out before the runner build
        run: docker logout

      - name: Build the runner image
        run: |
          cd neurons/executor
          source ./docker_runner_build.sh
          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV

      - name: Log in to Docker Hub again for the runner push (OIDC)
        uses: docker/login-action@v4   # >= 4.5.0 for Docker Hub OIDC
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
          # The exchanged token is the docker password for the rest of the job (default 300 s);
          # the pushes must finish inside it, so 30 min leaves room for a cold cache or a slow runner.
          DOCKERHUB_OIDC_EXPIREIN: "1800"
        with:
          username: daturaai

      - name: Publish the runner image
        run: |
          cd neurons/executor
          source ./docker_runner_publish.sh
