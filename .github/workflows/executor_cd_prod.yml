name: "CD: executor (prod)"

on:
  push:
    tags:
      - 'executor-v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dockerhub-push
    env:
      TAG: "latest" 
      TARGET_FILE: "docker-compose.app.yml"
      SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub (OIDC, no stored token)
        uses: docker/login-action@v4   # >= 4.5.0 for Docker Hub OIDC
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
          # The exchanged token is the docker password for the rest of the job (default 300 s);
          # build+push here takes up to ~140 s, so 30 min leaves room for a cold cache or a slow runner.
          DOCKERHUB_OIDC_EXPIREIN: "1800"
        with:
          username: daturaai

      - name: Make scripts executable
        run: |
          chmod +x neurons/executor/docker_build.sh
          chmod +x neurons/executor/docker_publish.sh
          chmod +x neurons/executor/docker_runner_build.sh
          chmod +x neurons/executor/docker_runner_publish.sh

      - name: Build and publish executor image
        run: |
          cd neurons/executor
          source ./docker_build.sh
          source ./docker_publish.sh
          echo "EXECUTOR_IMAGE_SHA256=${EXECUTOR_IMAGE_SHA256}" >> $GITHUB_ENV

      - name: Build and publish runner image
        run: |
          cd neurons/executor
          source ./docker_runner_build.sh
          source ./docker_runner_publish.sh

  # DAH-3602: a provider sets up a CVM from the release notes. The notes of executor-v1.130 carried no
  # runner digest, so one provider was about to pin a retired one, and no note said which compose hash
  # a correct CVM measures to. This job writes both into the GitHub release of the tag, after the
  # images are published: an existing release (the one a human created with generated notes) gets
  # the section appended once, a section that is not the generated one (a moved tag, a stale digest next
  # to the current hash, a doubled heading) is replaced, a missing release is created with generated
  # notes plus the section. The script is
  # neurons/executor/dstacktee/scripts/release_notes_update.sh; the validator's
  # tests/test_tdx_compose_hash_whitelist.py runs it against a stubbed `gh` for each of those cases.
  release-notes:
    name: "Release notes: CVM attestation section"
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Add the approved runner digest and the expected compose hash to the release
        run: bash neurons/executor/dstacktee/scripts/release_notes_update.sh "$TAG"
