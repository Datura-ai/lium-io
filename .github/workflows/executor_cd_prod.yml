name: "CD: executor (prod)"

on:
  push:
    tags:
      - 'executor-v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TAG: "latest" 
      TARGET_FILE: "docker-compose.app.yml"
      DOCKERHUB_PAT: ${{ secrets.DOCKERHUB_PAT }} 
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Make scripts executable
        run: |
          chmod +x neurons/executor/docker_build.sh
          chmod +x neurons/executor/docker_publish.sh
          chmod +x neurons/executor/docker_runner_build.sh
          chmod +x neurons/executor/docker_runner_publish.sh

      - name: Build and publish executor image
        run: |
          cd neurons/executor
          source ./docker_build.sh
          source ./docker_publish.sh
          echo "EXECUTOR_IMAGE_SHA256=${EXECUTOR_IMAGE_SHA256}" >> $GITHUB_ENV

      - name: Build and publish runner image
        run: |
          cd neurons/executor
          source ./docker_runner_build.sh
          source ./docker_runner_publish.sh

  # DAH-3602: a provider sets up a CVM from the release notes. The notes of executor-v1.130 carried no
  # runner digest, so one provider was about to pin a retired one, and no note said which compose hash
  # a correct CVM measures to. This job writes both into the GitHub release of the tag, after the
  # images are published: an existing release (the one a human created with generated notes) gets
  # the section appended once; a missing release is created with generated notes plus the section.
  release-notes:
    name: "Release notes: CVM attestation section"
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Add the approved runner digest and the expected compose hash to the release
        run: |
          set -euo pipefail
          python3 neurons/executor/dstacktee/scripts/compose_hash.py --release-notes > section.md
          if gh release view "$TAG" --json body --jq .body | tr -d '\r' > body.md; then
            # a body edited in the web UI comes back with CRLF; tr above makes the marker match
            if grep -qx "## CVM attestation" body.md; then
              echo "release $TAG already carries the section"
              exit 0
            fi
            { cat body.md; echo; cat section.md; } > notes.md
            gh release edit "$TAG" --notes-file notes.md
          else
            # no release yet for the tag: the section goes first, the generated notes after it
            gh release create "$TAG" --verify-tag --generate-notes --notes-file section.md
          fi
          gh release view "$TAG" --json body --jq .body | grep -A1 -F "## CVM attestation"
