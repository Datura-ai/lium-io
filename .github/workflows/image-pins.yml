name: image-pins

# Every image a compose file pulls must be in its registry: a provider installs from main, and
# `docker compose up` on a tag nobody pushed fails for every new install (daturaai/lium-watchtower:1.2.0 on
# #1432, 404 on Docker Hub). .github/scripts/check_image_pins.sh lets compose list the images and runs
# `docker manifest inspect` on each, anonymously, the way a provider pulls. A PR checks the refs it adds:
# Docker Hub gives an anonymous IP a small manifest budget and a runner's IP is shared. main and a manual
# run check every ref, so a tag removed from Docker Hub shows too. No `paths:` filter:
# the job reports on every PR, so it can be required, and a PR that adds no ref passes in seconds.
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-pins-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # a PR's checkout is its merge ref; the first parent is the base it merges into
          fetch-depth: 2
      - name: every pinned image is in its registry
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          case "$EVENT_NAME" in
            pull_request) base=HEAD^1 ;;
            merge_group) git fetch -q --depth=1 origin "$MERGE_GROUP_BASE" && base="$MERGE_GROUP_BASE" ;;
            *) base= ;;
          esac
          .github/scripts/check_image_pins.sh ${base:+--base "$base"}
