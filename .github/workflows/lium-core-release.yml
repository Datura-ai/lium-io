name: lium-core release (PyPI)

# Moved from Datura-ai/lium-core/.github/workflows/release.yml (DAH-3135). Same job, same OIDC
# trusted publishing: PyPI project `lium-core` must list this repository, this workflow file name
# and the `release` environment as its trusted publisher before the next release is run here.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release'
        required: true
        type: string

jobs:
  build:
    name: Build Python distribution
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/lium-core
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build package
      run: python -m build --sdist --wheel --outdir dist/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: packages/lium-core/dist/

  approve-and-publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        verbose: true
        print-hash: true
