name: lium-core release (PyPI)

# Publishes packages/lium-core to PyPI from a `lium-core-vX.Y.Z` tag whose version equals the one in its
# pyproject.toml (the version is not bumped by the workflow). The upload is PyPI trusted publishing from the
# `pypi` environment: pypi.org's publisher for `lium-core` names this repository, this file and that environment,
# and the environment's required reviewer approves each run (packages/lium-core/README.md "Release"). No PyPI
# token is stored anywhere. A manual run only builds; nothing is published.
on:
  push:
    tags:
      - 'lium-core-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Python distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/lium-core
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    # the tag is what the ruleset guards and what the reviewer approves; a tag that does not name the version in the
    # tree would publish a version nobody reviewed under that name
    - name: Tag must equal the package version
      if: github.ref_type == 'tag'
      run: |
        version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
        [[ "$GITHUB_REF_NAME" == "lium-core-v$version" ]] || { echo "tag $GITHUB_REF_NAME, pyproject version $version" >&2; exit 1; }

    - name: Build package
      run: python -m build --sdist --wheel --outdir dist/

    # PyPI refuses a distribution whose metadata it cannot render; find out here, before the publish job holds a
    # reviewer. Not --strict: pyproject.toml declares no readme, so twine warns about the missing long_description.
    - name: Check the distributions' metadata
      run: twine check dist/*

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: packages/lium-core/dist/

  # The only path to PyPI: runs for a `lium-core-v*` tag only, inside the `pypi` environment, with the OIDC token
  # minted for this job. PEP 740 attestations are the action's default; written out so an edit cannot drop them
  # unnoticed (`pypi.org/integrity/lium-core/<version>/<file>/provenance` holds the signed statement).
  approve-and-publish:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'lium-core-v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/lium-core/
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        attestations: true
        verbose: true
        print-hash: true
