name: "CD: lium mine preflight image"

# Builds neurons/validators/Dockerfile.preflight and pushes daturaai/compute-subnet-validator:preflight,
# the image `lium mine` runs for its GPU check before a node is added. A tag of the validator
# repository, because the lium-io-publish OIDC ruleset already covers it. It is published from main
# when its inputs change, not with a validator tag: validator releases no longer push tags, and
# a stale image rejects every GPU model added since it was built.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - neurons/validators/Dockerfile.preflight
      - neurons/validators/src/preflight/**
      - neurons/validators/src/services/**
      - neurons/validators/*.so
      - .github/workflows/lium_preflight_image.yml

permissions:
  contents: read

concurrency:
  group: lium-preflight-image
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: dockerhub-push
    # arm64 builds under QEMU on this x86 runner
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: daturaai/compute-subnet-validator:preflight
      # one OCI index for x86 and ARM (GB10 / DGX Spark, Grace) hosts, as watchtower_image.yml
      PLATFORMS: "linux/amd64,linux/arm64"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # same pinned actions and images as watchtower_image.yml (they run with id-token: write)
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      # Build before the login: the base image is a public docker.io image, and once the OIDC
      # token is the docker.io credential every pull uses it.
      - name: Build the image
        run: |
          cd neurons/validators
          # no provenance: it shows as an `unknown` platform and fails the check below (as watchtower/docker_build.sh)
          docker buildx build --platform "$PLATFORMS" --provenance=false -f Dockerfile.preflight \
            --output type=oci,dest=/tmp/preflight.oci.tar .

      - name: Log in to Docker Hub (OIDC, no stored token)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0 (>= 4.5.0 for Docker Hub OIDC)
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
          DOCKERHUB_OIDC_EXPIREIN: "1800"
        with:
          username: daturaai

      - name: Push the image
        run: skopeo copy --all oci-archive:/tmp/preflight.oci.tar "docker://docker.io/$IMAGE"

      - name: Check the tag lists both platforms
        run: |
          platforms=$(docker manifest inspect "$IMAGE" | jq -r '[.manifests[]?.platform.architecture] | sort | join(",")')
          if [ "$platforms" != "amd64,arm64" ]; then
            echo "::error::$IMAGE lists platforms '$platforms', not amd64,arm64"
            exit 1
          fi
          echo "published $IMAGE ($platforms)"
