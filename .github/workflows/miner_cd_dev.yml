name: "CD: Deploying Miner (dev) with Manual Trigger"

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TAG: "dev" 
      TARGET_FILE: "docker-compose.app.dev.yml"
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub (OIDC, no stored token)
        uses: docker/login-action@v4   # >= 4.5.0 for Docker Hub OIDC
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
        with:
          username: daturaai

      - name: Make scripts executable
        run: |
          chmod +x neurons/miners/docker_publish.sh
          chmod +x neurons/miners/docker_runner_publish.sh
          
      - name: Run docker_publish.sh
        run: |
          cd neurons/miners
          ./docker_publish.sh
          
      - name: Run docker_runner_publish.sh
        run: |
          cd neurons/miners
          ./docker_runner_publish.sh
