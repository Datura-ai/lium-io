name: "CD: Deploying Miner (dev) with Manual Trigger"

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dockerhub-push
    env:
      TAG: "dev" 
      TARGET_FILE: "docker-compose.app.dev.yml"
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      # Build before the login: the base images (python, docker) are public docker.io images, and once
      # the OIDC token is the docker.io credential every pull uses it. It covers only the daturaai push
      # repositories, so a build after the login fails with `insufficient scope` (run 36727847745).
      - name: Build the images
        run: |
          cd neurons/miners
          bash ./docker_build.sh
          bash ./docker_runner_build.sh

      - name: Log in to Docker Hub (OIDC, no stored token)
        uses: docker/login-action@v4   # >= 4.5.0 for Docker Hub OIDC
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
          # The exchanged token is the docker password for the rest of the job (default 300 s);
          # build+push here takes up to ~140 s, so 30 min leaves room for a cold cache or a slow runner.
          DOCKERHUB_OIDC_EXPIREIN: "1800"
        with:
          username: daturaai

      - name: Push the images
        run: |
          docker push "daturaai/compute-subnet-miner:$TAG"
          docker push "daturaai/compute-subnet-miner-runner:$TAG"
