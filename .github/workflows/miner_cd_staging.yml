name: "CD: Miner (staging)"

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: datura-ai/lium-miner

concurrency:
  group: staging-miner-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          # the action defaults to a mutable BuildKit tag; this job pushes what that builder produces
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      - name: Log in to Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # the staging validator, as the executor's dev image (executor_cd_dev.yml), and the staging owner key (staging
      # only, not on chain) whose signed validator messages the staging image follows
      - name: Name the staging validator
        env:
          STAGING_TRUST_OWNER_SS58: "5EeYEmUGfAJeTmVvYSmkpsUmVhiySd2Zch5nyt4tE1HygFX8"
          STAGING_TRUST_MESSAGE: "lium-validator:test:5DHgdomxxHSQf7neJWcagvGhTMKpqvKWwuprEaFF8C653qty:1"
          STAGING_TRUST_SIGNATURE: "0x7a850fadcaf52e47cb750e40b157100a610ec6801b07e2c39a7cf95a1384b556007e37b55e265e6ba6aca7f285fdf2185899c3cb0dfe01a93120e6cda57cb283"
          STAGING_TRUST_API_URL: "https://staging.lium.io/api"
        run: |
          echo '_VALIDATOR_HOTKEY_SS58 = "5DHgdomxxHSQf7neJWcagvGhTMKpqvKWwuprEaFF8C653qty"' > neurons/miners/src/core/config_override.py
          source scripts/staging_trust_override.sh
          staging_trust_override neurons/miners/src/core/config_override.py

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./neurons/miners
          build-contexts: |
            datura=./datura
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }}
          cache-from: type=gha,scope=miner
          cache-to: type=gha,mode=max,scope=miner

      - name: Summary
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging
          COMMIT: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          echo "### Miner Staging Deploy" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`$IMAGE\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`$COMMIT\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`$BRANCH\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Watchtower will pick up the new image within 60 seconds." >> $GITHUB_STEP_SUMMARY
