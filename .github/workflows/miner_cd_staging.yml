name: "CD: Miner (staging)"

on:
  workflow_dispatch:
  push:
    branches:
      - staging
      - feature/DAH-1676-prepare-staging-cd

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: datura-ai/lium-io

concurrency:
  group: staging-miner-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./neurons/miners
          build-contexts: |
            datura=./datura
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:miner-staging
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:miner-staging-${{ github.sha }}
          cache-from: type=gha,scope=miner
          cache-to: type=gha,mode=max,scope=miner

      - name: Summary
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:miner-staging
          COMMIT: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          echo "### Miner Staging Deploy" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`$IMAGE\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`$COMMIT\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`$BRANCH\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Watchtower will pick up the new image within 60 seconds." >> $GITHUB_STEP_SUMMARY
