name: Pinned actions

# no path filter: a local action can live anywhere in the repo, and a required check must report on every PR
on:
  pull_request:
    # edited: a retarget to main (a stacked PR) with no new push still gets this required check on the new merge ref
    types: [opened, synchronize, reopened, edited]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # every workflow and local action pins third-party actions to a commit and images to a digest, never to a movable tag;
      # the files are parsed as YAML so quoting and spacing cannot hide a reference
      - name: All actions are pinned to commit SHAs
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q pyyaml==6.0.3
          /tmp/venv/bin/python - <<'PY'
          import pathlib, posixpath, re, subprocess, sys, tempfile, yaml

          class Loader(yaml.SafeLoader):
              """GitHub's YAML: only true/false are booleans (PyYAML's 1.1 rules make yes/on/no/off booleans too,
              so the job IDs yes and on both became True and one job replaced the other), and a repeated key is
              an error, not a silent replacement."""
              def construct_mapping(self, node, deep=False):
                  keys = [self.construct_object(k, deep=deep) for k, _ in node.value]
                  dup = {repr(k) for k in keys if keys.count(k) > 1}
                  if dup:
                      raise yaml.constructor.ConstructorError(None, None, f"duplicate key(s) {', '.join(sorted(dup))}", node.start_mark)
                  return super().construct_mapping(node, deep=deep)
          Loader.yaml_implicit_resolvers = {
              ch: [(tag, rx) for tag, rx in rs if tag != "tag:yaml.org,2002:bool"]
              for ch, rs in yaml.SafeLoader.yaml_implicit_resolvers.items()
          }
          for ch in "tTfF":
              Loader.yaml_implicit_resolvers.setdefault(ch, []).insert(0, ("tag:yaml.org,2002:bool", re.compile(r"^(?:true|True|TRUE|false|False|FALSE)$")))

          digest = r"docker://[^@\s]+@sha256:[0-9a-f]{64}"
          pinned = re.compile(rf"(?!docker://)[^@\s]+@[0-9a-f]{{40}}|{digest}")
          # the runner reads the scheme case-insensitively, so DOCKER:// must not slip past the checks
          norm = lambda ref: re.sub(r"^docker://", "docker://", str(ref), flags=re.I)

          def scan(files, tracked):
              bad = []
              for path in files:
                  try:
                      doc = yaml.load(path.read_text(), Loader=Loader) or {}
                  except yaml.YAMLError as e:
                      bad.append(f"{path}: not checkable: {e}".replace("\n", " "))
                      continue
                  jobs = list((doc.get("jobs") or {}).values())
                  runs = doc.get("runs") or {}
                  steps = [step for job in jobs for step in job.get("steps") or []] + list(runs.get("steps") or [])
                  refs = [("job", job.get("uses")) for job in jobs] + [("step", step.get("uses")) for step in steps]
                  for level, ref in refs:
                      if ref is None:
                          continue
                      if str(ref).startswith("./"):
                          # a local action is checked through its manifest, so it must be a tracked one: a manifest written
                          # at run time is never scanned (the runner resolves ./ from the repository root)
                          d = str(ref)[2:]  # the literal path the runner opens: nothing after it is a ref
                          # a job's ./x.yml is a reusable workflow (scanned with the workflows); a step's ./dir is always an
                          # action directory, so a step path naming a workflow file still needs a manifest inside it. Only
                          # action.yml: the runner prefers it over action.yaml, so one generated beside a tracked action.yaml
                          # would run unscanned
                          want = [d] if level == "job" else [posixpath.join(d, "action.yml")]
                          if not {posixpath.normpath(w) for w in want} & tracked:
                              bad.append(f"{path}: {ref} is not a tracked workflow or action manifest")
                      elif not pinned.fullmatch(norm(ref)):
                          bad.append(f"{path}: {ref}")
                  # a Docker action's image: a registry image needs a digest; any other value must be a tracked Dockerfile
                  # beside the manifest (the runner hands a bare value that is not a file to Docker as an image name)
                  image = runs.get("image")
                  if image is not None:
                      local = posixpath.normpath(posixpath.join(posixpath.dirname(str(path)), str(image)))
                      ok = re.fullmatch(digest, norm(image)) if norm(image).startswith("docker://") else local in tracked
                      if not ok:
                          bad.append(f"{path}: runs.image {image}")
                  # job containers and services start before the steps, with the job's token: digest only
                  for job in jobs:
                      container = job.get("container")
                      images = [container.get("image") if isinstance(container, dict) else container]
                      images += [(svc or {}).get("image") for svc in (job.get("services") or {}).values()]
                      for img in images:
                          if img and not re.fullmatch(digest, "docker://" + re.sub(r"^docker://", "", str(img), flags=re.I)):
                              bad.append(f"{path}: container/service image {img}")
              return bad

          # regression self-test: job IDs yes/on stay two jobs, and a repeated job ID is refused, before the real scan
          sha = "a" * 40
          cases = {
              "jobs:\n  yes:\n    steps:\n      - uses: acme/act@v1\n  on:\n    steps:\n      - uses: acme/act@" + sha + "\n": 1,
              "jobs:\n  a:\n    steps:\n      - uses: acme/act@v1\n  a:\n    steps:\n      - uses: acme/act@" + sha + "\n": 1,
              "jobs:\n  yes:\n    steps:\n      - uses: acme/act@" + sha + "\n  on:\n    steps:\n      - uses: acme/act@" + sha + "\n": 0,
              "jobs:\n  a:\n    steps:\n      - uses: ./gen/act\n      - uses: ./.github/actions/ok/\n      - uses: ./.github/actions/ok@main\n      - uses: ./.github/workflows/ok.yml\n  b:\n    uses: ./.github/workflows/ok.yml\n  c:\n    uses: ./.github/workflows/gen.yml\n": 4,
          }
          img = "runs:\n  using: docker\n  image: "
          cases.update({
              "jobs:\n  a:\n    steps:\n      - uses: ./.github/actions/yaml\n": 1,  # only action.yaml tracked
              img + "alpine:3\n": 1,
              img + "docker://alpine:3\n": 1,
              img + "docker://alpine@sha256:" + "0" * 64 + "\n": 0,
              img + "Dockerfile\n": 0,
              img + "Missing.Dockerfile\n": 1,
          })
          with tempfile.TemporaryDirectory() as d:
              for i, (text, want) in enumerate(cases.items()):
                  f = pathlib.Path(d, f"case{i}.yml"); f.write_text(text)
                  known = {".github/actions/ok/action.yml", ".github/workflows/ok.yml", ".github/actions/yaml/action.yaml", f"{d}/Dockerfile"}
                  assert len(scan([f], known)) == want, (i, scan([f], known))

          # every tracked action manifest, wherever it lives: `uses: ./any/dir` runs that dir's action.yml
          actions = [a for a in subprocess.run(["git", "ls-files", "-z", ":(glob)**/action.yml", ":(glob)**/action.yaml"], capture_output=True, text=True, check=True).stdout.split("\0") if a]
          files = sorted(pathlib.Path(".github/workflows").glob("*.y*ml")) + sorted(pathlib.Path(a) for a in actions)
          tracked = set(subprocess.run(["git", "ls-files", "-z"], capture_output=True, text=True, check=True).stdout.split("\0"))
          bad = scan(files, tracked)
          print("\n".join(bad) or f"all pinned ({len(files)} files)")
          sys.exit(1 if bad else 0)
          PY
