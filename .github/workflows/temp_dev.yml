name: Dev environment

# `/temp-dev [<N>h|extend|destroy]` on a pull request: a temporary copy of the whole platform, 4
# hours by default. Each repository contributes the branch with this name, or main when it has no
# such branch. The work happens in Datura-ai/lium-infra; see its TEMP_DEV.md.
#
# This job only hands the comment over. It dispatches rather than calling a reusable workflow
# because this repository is public and lium-infra is private, and GitHub shares a private
# repository's reusable workflows with private callers only. The command itself is read there, so
# nothing here has to be kept in step with it.

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  request:
    # the marker keeps this feature's own comments (they quote `/temp-dev`) from starting a run
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/temp-dev') && !contains(github.event.comment.body, '<!-- temp-dev-bot -->')
    runs-on: ubuntu-latest
    # the token lives in this environment, whose branch rule is `main` only: a workflow on a branch
    # of this public repository must not be able to read a token that can start a run in lium-infra
    environment: temp-dev
    steps:
      - name: Hand the comment to lium-infra
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.TEMP_DEV_GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'Datura-ai', repo: 'lium-infra',
              workflow_id: 'temp-dev-request.yml', ref: 'main',
              inputs: {
                source_repo: context.repo.repo,
                source_pr: String(context.issue.number),
                // the body and the author are read from the comment there, so a run is judged on
                // what the comment says, not on what this job passes along
                comment_id: String(context.payload.comment.id),
              },
            });
