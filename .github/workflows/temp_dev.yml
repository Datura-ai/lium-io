name: Temp staging

# `/temp-dev [<N>h|destroy]` on a PR: a temporary copy of the full staging stack, 4 hours by
# default. Each repository contributes the branch with this name, or main when it has no such
# branch. The work happens in Datura-ai/lium-infra; see its TEMP_DEV.md.

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  request:
    # the marker keeps this feature's own comments (they quote `/temp-dev`) from starting a run
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/temp-dev') && !contains(github.event.comment.body, '<!-- temp-dev-bot -->')
    uses: Datura-ai/lium-infra/.github/workflows/temp-dev-request.yml@main
    secrets:
      github-token: ${{ secrets.TEMP_DEV_GITHUB_TOKEN }}
