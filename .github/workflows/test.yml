name: Tests

on:
  # no `paths:` filter on the workflow: a required status check that never reports blocks the
  # merge button and stalls a merge queue. The filtering happens inside — the `route` job reads
  # the PR's (or merge-group entry's) file list and each package job runs only when its package,
  # datura/ or .github/ changed (lium_protocol/ also selects validators). tests-ok reports on every PR either way. No `branches:` filter
  # either: a PR stacked on another PR's branch (the loop's and the team's dependent PRs) used
  # to get no run at all until its base merged and GitHub retargeted it to main.
  # DAH-5832 (CI minutes): before a review approves, a PR runs only route and ruff-check; the package jobs and
  # e2e-gate run once it is approved (the approving review starts a run) and on every push after that.
  # e2e-gate is the required check, and an unapproved run reports it under another name, so a PR cannot
  # merge until e2e-gate has run on its head. The push to main still runs: the ruleset does not require an
  # up-to-date branch, so a squash merge can land a tree no PR run tested.
  pull_request:
  push:
    branches: [main]
  pull_request_review:
    types: [submitted]
  # merge queue: a queued group (main + the PRs ahead + this one) is merged only when the checks required
  # on main report on the merge_group ref; without this trigger an enqueued PR waits forever.
  merge_group:
    branches: [main]

permissions:
  contents: read
  # the router lists the PR's files
  pull-requests: read

# a merge-group run is never cancelled: each group has its own ref, and cancelling one would drop its
# PRs from the queue. A push to main gets a group per commit, so the next push never cancels it: a push tests only
# before..after (changed-packages), and a cancelled commit's changes would never run on main (DAH-5586).
# A review other than a member's approval (a comment, a request for changes, an outside approval) gets a group of its
# own: its run starts no suite and must not cancel the PR's run in progress.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.sha }}${{ github.event_name == 'pull_request_review' && (github.event.review.state != 'approved' || !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.review.author_association)) && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_review' }}

jobs:
  route:
    # a comment or request-changes review starts a run too; it skips every job (no minutes)
    if: github.event_name != 'pull_request_review' || github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      validators: ${{ steps.pkgs.outputs.validators }}
      executor: ${{ steps.pkgs.outputs.executor }}
      miners: ${{ steps.pkgs.outputs.miners }}
      protocol: ${{ steps.pkgs.outputs.protocol }}
      e2e: ${{ steps.pkgs.outputs.e2e }}
      approved: ${{ steps.pkgs.outputs.approved }}
    steps:
      - uses: actions/checkout@v4
      - id: pkgs
        uses: ./.github/actions/changed-packages

  ruff-check:
    # DAH-2972: gate the rule families that are at zero after the dead-code sweep (DAH-2971) so
    # it cannot regress: F (pyflakes: unused imports/variables, redefinitions, undefined names)
    # and ASYNC210/ASYNC251 (blocking HTTP call / time.sleep inside a coroutine). F541 stays
    # ignored and the other families stay out until each is at zero; add a family here in the
    # commit that fixes it. Config: the root pyproject.toml ([tool.ruff]).
    # Runs before approval too; like route, a review other than an approval skips it.
    if: github.event_name != 'pull_request_review' || github.event.review.state == 'approved'
    name: ruff check (pyflakes, blocking calls in coroutines)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # same pin as lium-platform's CI
      - run: pip install ruff==0.15.5
      - run: ruff check --select F,ASYNC210,ASYNC251 --ignore F541 --extend-exclude migrations neurons datura watchtower

  validators:
    name: Validators Tests
    needs: route
    if: ${{ !cancelled() && needs.route.outputs.validators == 'true' && needs.route.outputs.approved == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: neurons/validators

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pdm
        uses: pdm-project/setup-pdm@v4
        with:
          cache: true
          cache-dependency-path: neurons/validators/pdm.lock

      - name: Install dependencies
        run: pdm install

      - name: Run tests
        env:
          BITTENSOR_WALLET_NAME: test_wallet
          BITTENSOR_WALLET_HOTKEY_NAME: test_hotkey
          SQLALCHEMY_DATABASE_URI: sqlite:///test.db
          ASYNC_SQLALCHEMY_DATABASE_URI: sqlite+aiosqlite:///test.db
          TDX_VERIFIER_URL: http://localhost:8000/verify
        run: pdm run pytest tests/ -v --tb=short --strict-markers

  executor:
    name: Executor Tests
    needs: route
    if: ${{ !cancelled() && needs.route.outputs.executor == 'true' && needs.route.outputs.approved == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: neurons/executor

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pdm
        uses: pdm-project/setup-pdm@v4
        with:
          cache: true
          cache-dependency-path: neurons/executor/pdm.lock

      - name: Install dependencies
        run: pdm install

      - name: Run tests
        run: mkdir -p tmp && pdm run pytest tests/ -v --tb=short

  miners:
    # neurons/miners/tests never ran in CI; the miner talks to the portal API and the
    # validators, so a broken client ships to every provider on the next tag
    name: Miners Tests
    needs: route
    if: ${{ !cancelled() && needs.route.outputs.miners == 'true' && needs.route.outputs.approved == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: neurons/miners

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pdm
        uses: pdm-project/setup-pdm@v4
        with:
          cache: true
          cache-dependency-path: neurons/miners/pdm.lock

      - name: Install dependencies
        run: pdm install

      - name: Run tests
        run: pdm run pytest tests/ -v --tb=short

  protocol:
    # DAH-3247: the validator↔backend wire protocol package (lium_protocol/) — its tests, and the
    # committed JSON-schema snapshot must equal the models: a model change without a regenerated,
    # reviewed snapshot fails here (`python -m lium_protocol.schema --write` regenerates it).
    # Routed like the neurons; a lium_protocol/ change also selects `validators` (the compat test).
    name: Protocol package (tests + schema snapshot)
    needs: route
    if: ${{ !cancelled() && needs.route.outputs.protocol == 'true' && needs.route.outputs.approved == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        working-directory: lium_protocol

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        # the renderer is pinned: the snapshot is pydantic's JSON Schema, and a pydantic release can change it
        # (2.10 → 2.12 did); 2.13 wrote the committed snapshot and is the validator's lock (neurons/validators/pdm.lock)
        run: pip install -q . pytest "pydantic==2.13.*"

      - name: Schema snapshot matches the models
        run: python -m lium_protocol.schema --check

      - name: Run tests
        run: python -m pytest tests -v --tb=short

  tests-ok:
    # sums up every job; the ruleset requires e2e-gate (see the e2e job).
    # A package whose job was skipped as unchanged passes, and so does a skipped e2e-gate
    # (a PR that touches no neuron); a failed or cancelled one fails this. Before approval it is skipped: ruff-check shows
    # its own result, and e2e-gate makes the same check once the jobs run.
    name: tests-ok
    needs: [route, validators, executor, miners, ruff-check, protocol, e2e]
    if: always() && needs.route.result != 'skipped' && needs.route.outputs.approved == 'true'
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  # The subnet loop end to end on one runner (e2e/README.md): the PR's executor on its own dockerd, the PR's miner that
  # owns it, and the PR's validator services signing in, installing keys, scraping, walking the check pipeline,
  # publishing the verdict, then renting a container and tearing it down — plus every refusal a spoofer must hit.
  # Routed like the package jobs: runs when any neuron, datura/, .github/ or e2e/ changed (a change only under a
  # neuron's own tests/ directory does not count: the stack never runs those), skipped otherwise, and
  # reported through tests-ok either way. gate.sh puts a hard timeout on every step, runs every suite even after a
  # failure, and always leaves e2e/artifacts (timings, summary.md, junit per suite, compose logs, the suites' JSON
  # dumps) — uploaded on every run and summarised in one sticky PR comment. Reproduce: make -C e2e e2e-full.
  e2e:
    # DAH-5832: the check is named e2e-gate only when it runs on an approved PR (or off a PR). Skipped, it reports
    # under another name, so the required e2e-gate stays missing and the PR cannot merge before e2e-gate ran.
    # An approved PR that changed no neuron runs the job with its steps skipped and passes.
    name: ${{ needs.route.outputs.approved == 'true' && 'e2e-gate' || 'e2e-gate (runs once a review approves)' }}
    # e2e-gate is the one required check, so it also fails when route, ruff-check or a package test job failed:
    # a red unit test cannot merge on a green e2e
    needs: [route, validators, executor, miners, ruff-check, protocol]
    if: ${{ !cancelled() && needs.route.outputs.approved == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write   # the sticky result comment (skipped on fork PRs, where the token is read-only)
    env:
      RUN: ${{ needs.route.outputs.e2e }}
    defaults:
      run:
        working-directory: e2e
    steps:
      - name: route, ruff-check and the package test jobs passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        working-directory: ${{ github.workspace }}
        run: echo "::error::a package test job or ruff failed (see tests-ok)" && exit 1
      - uses: actions/checkout@v4
        if: env.RUN == 'true'
      # the gha layer cache (E2E_CACHE, e2e/Makefile) needs a builder that exports cache and the Actions cache URL + token
      - uses: docker/setup-buildx-action@v3
        if: env.RUN == 'true'
      - uses: crazy-max/ghaction-github-runtime@v3
        if: env.RUN == 'true'
      - name: build, up, every suite, logs, down — each step under a hard timeout (gate.sh)
        if: env.RUN == 'true'
        id: gate
        timeout-minutes: 55
        env:
          E2E_CACHE: gha
        run: ./gate.sh
      - uses: actions/upload-artifact@v4
        id: artifacts
        if: always() && env.RUN == 'true'
        with:
          name: e2e-gate-${{ github.event.pull_request.number || github.run_id }}-${{ github.run_attempt }}
          path: e2e/artifacts
          retention-days: 14
      - name: result on the PR
        if: always() && env.RUN == 'true' && github.event.pull_request && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ steps.gate.outcome }}
          ARTIFACT_URL: ${{ steps.artifacts.outputs.artifact-url }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- e2e-gate -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const summary = fs.existsSync('e2e/artifacts/summary.md')
              ? fs.readFileSync('e2e/artifacts/summary.md', 'utf8')
              : `**e2e gate: FAIL** — no summary written: the gate did not finish (outcome ${process.env.OUTCOME}: it failed before its first step, or the 55-minute step limit killed it mid-run); see the run log.`;
            const body = [
              marker,
              `### e2e gate · ${context.payload.pull_request.head.sha.slice(0, 8)} · [run](${runUrl})${process.env.ARTIFACT_URL ? ` · [artifacts](${process.env.ARTIFACT_URL})` : ''}`,
              '',
              summary.trim(),
              '',
              `<sub>Compose stack: the PR's executor + miner + validator services on one runner, no chain, no GPU (e2e/README.md). Reproduce: \`make -C e2e e2e-full\`; on a GPU box: \`E2E_GPU=1 make -C e2e e2e-full\`.</sub>`,
            ].join('\n');
            // every page: on a PR with more than 100 comments a single page would miss the marker and post a second comment
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: context.issue.number, per_page: 100 });
            const mine = comments.find(c => c.body?.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
