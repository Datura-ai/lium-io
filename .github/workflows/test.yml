name: Tests

on:
  # no `paths:` filter on the workflow: a required status check that never reports blocks the
  # merge button and stalls a merge queue. The filtering happens inside — the `route` job reads
  # the PR's (or merge-group entry's) file list and each package job runs only when its package,
  # datura/ or .github/ changed. tests-ok reports on every PR either way. No `branches:` filter
  # either: a PR stacked on another PR's branch (the loop's and the team's dependent PRs) used
  # to get no run at all until its base merged and GitHub retargeted it to main.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # the router lists the PR's files
  pull-requests: read

# a second push to the same PR cancels the first run
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      validators: ${{ steps.pkgs.outputs.validators }}
      executor: ${{ steps.pkgs.outputs.executor }}
      miners: ${{ steps.pkgs.outputs.miners }}
    steps:
      - uses: actions/checkout@v4
      - id: pkgs
        uses: ./.github/actions/changed-packages

  validators:
    name: Validators Tests
    needs: route
    if: needs.route.outputs.validators == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: neurons/validators

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pdm
        uses: pdm-project/setup-pdm@v4
        with:
          cache: true
          cache-dependency-path: neurons/validators/pdm.lock

      - name: Install dependencies
        run: pdm install

      - name: Run tests
        env:
          BITTENSOR_WALLET_NAME: test_wallet
          BITTENSOR_WALLET_HOTKEY_NAME: test_hotkey
          SQLALCHEMY_DATABASE_URI: sqlite:///test.db
          ASYNC_SQLALCHEMY_DATABASE_URI: sqlite+aiosqlite:///test.db
          ENABLE_TDX_ATTESTATION: True
          TDX_VERIFIER_URL: http://localhost:8000/verify
        run: pdm run pytest tests/ -v --tb=short --strict-markers

  executor:
    name: Executor Tests
    needs: route
    if: needs.route.outputs.executor == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: neurons/executor

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.11'

      - name: Install pdm
        uses: pdm-project/setup-pdm@v4
        with:
          cache: true
          cache-dependency-path: neurons/executor/pdm.lock

      - name: Install dependencies
        run: pdm install

      - name: Run tests
        run: mkdir -p tmp && pdm run pytest tests/ -v --tb=short

  miners:
    # neurons/miners/tests never ran in CI; the miner talks to the portal API and the
    # validators, so a broken client ships to every provider on the next tag
    name: Miners Tests
    needs: route
    if: needs.route.outputs.miners == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: neurons/miners

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pdm
        uses: pdm-project/setup-pdm@v4
        with:
          cache: true
          cache-dependency-path: neurons/miners/pdm.lock

      - name: Install dependencies
        run: pdm install

      - name: Run tests
        run: pdm run pytest tests/ -v --tb=short

  lint:
    # ruff format is the repo's pre-commit hook (.pre-commit-config.yaml, same version pin)
    # and CI never ran it. REPORT-ONLY: on 6 Sep 2026 main had 207/301 validators, 30/51
    # executor and 20/43 miners files unformatted, so gating would block every PR until one
    # `ruff format` commit per package lands; drop continue-on-error and add `lint` to
    # tests-ok after that. `ruff check` is left out: it has open findings too.
    name: ruff format (${{ matrix.package }})
    needs: route
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        package: [validators, executor, miners]
    steps:
      # `matrix` is not available in a job-level `if`, so the skip sits on the steps
      - if: needs.route.outputs[matrix.package] == 'true'
        uses: actions/checkout@v4
      - if: needs.route.outputs[matrix.package] == 'true'
        uses: astral-sh/ruff-action@v3
        continue-on-error: true
        with:
          version: "0.5.1"
          args: format --check
          src: neurons/${{ matrix.package }}

  tests-ok:
    # the one context to require in the ruleset; lium-io requires no status check today.
    # A package whose job was skipped as unchanged passes. `lint` joins once the packages
    # are formatted (see above).
    name: tests-ok
    needs: [route, validators, executor, miners]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
