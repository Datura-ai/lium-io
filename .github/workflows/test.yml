name: Tests

on:
  # no `paths:` filter on the workflow: a required status check that never reports blocks the
  # merge button and stalls a merge queue. The filtering happens inside — the `route` job reads
  # the PR's (or merge-group entry's) file list and each package job runs only when its package,
  # datura/ or .github/ changed (lium_protocol/ also selects validators). tests-ok reports on every PR either way. No `branches:` filter
  # either: a PR stacked on another PR's branch (the loop's and the team's dependent PRs) used
  # to get no run at all until its base merged and GitHub retargeted it to main.
  # CI minutes: once the merge queue is active, a PR runs only route, ruff-check and the deferred e2e-gate
  # check, a push to main only route and tests-ok, and the queue runs the suites. Until then PRs and pushes
  # keep running them as before.
  # The flag and the queue rule are independent, so enable them in order: add the merge-queue rule to the main
  # ruleset first, then set the repository variable MERGE_QUEUE_ENABLED=true; to turn the queue off, unset the
  # variable first. If the variable is true while the rule is off, or a merge bypasses the queue, the PR run
  # defers and no run tests that tree.
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  pull_request_review:
    types: [submitted]
  # merge queue: a queued group (main + the PRs ahead + this one) is merged only when the checks required
  # on main report on the merge_group ref; without this trigger an enqueued PR waits forever.
  merge_group:
    branches: [main]

permissions:
  contents: read
  # the router lists the PR's files
  pull-requests: read

# a merge-group run is never cancelled: each group has its own ref, and cancelling one would drop its
# PRs from the queue. A push to main gets a group per commit, so the next push never cancels it: a push tests only
# before..after (changed-packages), and a cancelled commit's changes would never run on main (DAH-5586).
# A review other than a member's approval (a comment, a request for changes, an outside approval) gets a group of its
# own: its run starts no suite and must not cancel the PR's run in progress.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.sha }}${{ github.event_name == 'pull_request_review' && (github.event.review.state != 'approved' || !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.review.author_association)) && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_review' }}

jobs:
  route:
    # a comment, request-changes or outside review starts a run too; it skips every job (no minutes).
    # DAH-6518: a CONTRIBUTOR approval runs route too: a member with private org membership shows as CONTRIBUTOR
    # here, and changed-packages counts the approval only if its author can write to the repo.
    # Known limit: a writer shown as NONE or FIRST_TIME_CONTRIBUTOR still skips; make the org membership public or have a member approve.
    if: >-
      github.event_name != 'pull_request_review' || (github.event.review.state == 'approved'
      && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR", "CONTRIBUTOR"]'), github.event.review.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      validators: ${{ steps.pkgs.outputs.validators }}
      executor: ${{ steps.pkgs.outputs.executor }}
      miners: ${{ steps.pkgs.outputs.miners }}
      protocol: ${{ steps.pkgs.outputs.protocol }}
      e2e: ${{ steps.pkgs.outputs.e2e }}
      shards: ${{ steps.pkgs.outputs.shards }}
      approved: ${{ steps.pkgs.outputs.approved }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: pkgs
        # $/ runs this repository's action at the running commit (a squash merge keeps it on main; no checkout needed)
        uses: $/.github/actions/changed-packages

  ruff-check:
    # DAH-2972: gate the rule families that are at zero after the dead-code sweep (DAH-2971) so
    # it cannot regress: F (pyflakes: unused imports/variables, redefinitions, undefined names)
    # and ASYNC210/ASYNC251 (blocking HTTP call / time.sleep inside a coroutine). F541 stays
    # ignored and the other families stay out until each is at zero; add a family here in the
    # commit that fixes it. Config: the root pyproject.toml ([tool.ruff]).
    # Runs before approval too; it starts on the same reviews as route (e2e-gate passes a skipped ruff-check).
    if: >-
      (github.event_name != 'push' || vars.MERGE_QUEUE_ENABLED != 'true')
      && (github.event_name != 'pull_request_review'
      || (github.event.review.state == 'approved'
      && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR", "CONTRIBUTOR"]'), github.event.review.author_association)))
    name: ruff check (pyflakes, blocking calls in coroutines)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      # same pin as lium-platform's CI
      - run: pip install ruff==0.15.5
      - run: ruff check --select F,ASYNC210,ASYNC251 --ignore F541 --extend-exclude migrations neurons datura watchtower

  validators:
    name: Validators Tests
    needs: route
    if: ${{ !cancelled() && needs.route.outputs.validators == 'true' && needs.route.outputs.approved == 'true' && (github.event_name == 'merge_group' || vars.MERGE_QUEUE_ENABLED != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: neurons/validators

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install pdm
        uses: pdm-project/setup-pdm@544d7237314ee09c256785bd360f6b30add38b37 # v4.6
        with:
          cache: true
          cache-dependency-path: neurons/validators/pdm.lock

      - name: Install dependencies
        run: pdm install

      - name: Run tests (parallel)
        env:
          BITTENSOR_WALLET_NAME: test_wallet
          BITTENSOR_WALLET_HOTKEY_NAME: test_hotkey
          SQLALCHEMY_DATABASE_URI: sqlite:///test.db
          ASYNC_SQLALCHEMY_DATABASE_URI: sqlite+aiosqlite:///test.db
          TDX_VERIFIER_URL: http://localhost:8000/verify
        run: pdm run pytest tests/ -v --tb=short --strict-markers -n 2 --dist loadfile --ignore=tests/test_loopback_plugin_setup.py --ignore=tests/test_sshd_bootstrap_script.py

      - name: Run timing-sensitive tests (serial)
        env:
          BITTENSOR_WALLET_NAME: test_wallet
          BITTENSOR_WALLET_HOTKEY_NAME: test_hotkey
          SQLALCHEMY_DATABASE_URI: sqlite:///test.db
          ASYNC_SQLALCHEMY_DATABASE_URI: sqlite+aiosqlite:///test.db
          TDX_VERIFIER_URL: http://localhost:8000/verify
        run: pdm run pytest tests/test_loopback_plugin_setup.py tests/test_sshd_bootstrap_script.py -v --tb=short --strict-markers

  executor:
    name: Executor Tests
    needs: route
    if: ${{ !cancelled() && needs.route.outputs.executor == 'true' && needs.route.outputs.approved == 'true' && (github.event_name == 'merge_group' || vars.MERGE_QUEUE_ENABLED != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: neurons/executor

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install pdm
        uses: pdm-project/setup-pdm@544d7237314ee09c256785bd360f6b30add38b37 # v4.6
        with:
          cache: true
          cache-dependency-path: neurons/executor/pdm.lock

      - name: Install dependencies
        run: pdm install

      - name: Run tests
        run: mkdir -p tmp && pdm run pytest tests/ -v --tb=short

  miners:
    # neurons/miners/tests never ran in CI; the miner talks to the portal API and the
    # validators, so a broken client ships to every provider on the next tag
    name: Miners Tests
    needs: route
    if: ${{ !cancelled() && needs.route.outputs.miners == 'true' && needs.route.outputs.approved == 'true' && (github.event_name == 'merge_group' || vars.MERGE_QUEUE_ENABLED != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: neurons/miners

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install pdm
        uses: pdm-project/setup-pdm@544d7237314ee09c256785bd360f6b30add38b37 # v4.6
        with:
          cache: true
          cache-dependency-path: neurons/miners/pdm.lock

      - name: Install dependencies
        run: pdm install

      - name: Run tests
        run: pdm run pytest tests/ -v --tb=short

  protocol:
    # DAH-3247: the validator↔backend wire protocol package (lium_protocol/) — its tests, and the
    # committed JSON-schema snapshot must equal the models: a model change without a regenerated,
    # reviewed snapshot fails here (`python -m lium_protocol.schema --write` regenerates it).
    # Routed like the neurons; a lium_protocol/ change also selects `validators` (the compat test).
    name: Protocol package (tests + schema snapshot)
    needs: route
    if: ${{ !cancelled() && needs.route.outputs.protocol == 'true' && needs.route.outputs.approved == 'true' && (github.event_name == 'merge_group' || vars.MERGE_QUEUE_ENABLED != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        working-directory: lium_protocol

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install
        # the renderer is pinned: the snapshot is pydantic's JSON Schema, and a pydantic release can change it
        # (2.10 → 2.12 did); 2.13 wrote the committed snapshot and is the validator's lock (neurons/validators/pdm.lock)
        run: pip install -q . pytest "pydantic==2.13.*"

      - name: Schema snapshot matches the models
        run: python -m lium_protocol.schema --check

      - name: Run tests
        run: python -m pytest tests -v --tb=short

  tests-ok:
    # sums up every job; the ruleset requires e2e-gate (see the e2e job).
    # A package whose job was skipped as unchanged passes, and so does the deferred e2e gate on a PR;
    # a failed or cancelled one fails this. Before approval it is skipped: ruff-check shows its own result.
    name: tests-ok
    needs: [route, validators, executor, miners, ruff-check, protocol, e2e]
    if: always() && needs.route.result != 'skipped' && needs.route.outputs.approved == 'true'
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  # The subnet loop end to end on one runner (e2e/README.md): the PR's executor on its own dockerd, the PR's miner that
  # owns it, and the PR's validator services signing in, installing keys, scraping, walking the check pipeline,
  # publishing the verdict, then renting a container and tearing it down — plus every refusal a spoofer must hit.
  # The real gate runs in the merge queue (and on approved PRs and pushes until the queue is active): runs when
  # any neuron, datura/, .github/ or e2e/ changed (a change only under a neuron's own tests/ directory does not
  # count: the stack never runs those), skipped otherwise, and reported through tests-ok either way. gate.sh puts
  # a hard timeout on every step, runs every suite even after a failure, and always leaves e2e/artifacts (timings,
  # summary.md, junit per suite, compose logs, the suites' JSON dumps) — uploaded on every run, and summarised in
  # one sticky PR comment when the run is on a PR. Reproduce: make -C e2e e2e-full.
  e2e-suites:
    # Sharded: each shard builds its own stack on its own runner, so the wall time is the slowest shard (rental)
    # instead of the sum of every suite. Runs beside the package jobs, not after them. e2e-gate (below) is still
    # the one required check, merges the shards' summaries and fails when either side failed.
    name: e2e ${{ matrix.shard }}
    needs: [route]
    if: ${{ !cancelled() && needs.route.result == 'success' && needs.route.outputs.approved == 'true' && needs.route.outputs.e2e == 'true' && (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || vars.MERGE_QUEUE_ENABLED != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # protocol rides with cycle: it is 27 s, a runner of its own would only add a stack build
      matrix:
        include:
          - shard: cycle-protocol
            suites: cycle protocol
          - shard: rental
            suites: rental
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: contains(fromJSON(needs.route.outputs.shards), matrix.shard)
      # the gha layer cache (E2E_CACHE, e2e/Makefile) needs a builder that exports cache and the Actions cache URL + token
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        if: contains(fromJSON(needs.route.outputs.shards), matrix.shard)
        with:
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124 # v3.1.0
        if: contains(fromJSON(needs.route.outputs.shards), matrix.shard)
      - name: build, up, ${{ matrix.suites }}, logs, down — each step under a hard timeout (gate.sh)
        id: gate
        if: contains(fromJSON(needs.route.outputs.shards), matrix.shard)
        timeout-minutes: 55
        env:
          E2E_CACHE: gha
          SUITES: ${{ matrix.suites }}
        run: ./gate.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: artifacts
        if: always() && contains(fromJSON(needs.route.outputs.shards), matrix.shard)
        with:
          name: e2e-${{ matrix.shard }}
          path: e2e/artifacts
          retention-days: 14
          overwrite: true

  e2e:
    # e2e-gate is the one required check, so the job never skips: a skipped job does not evaluate its
    # name expression and reports under the raw expression text, and a static-name skip would report the
    # required check as passing (DAH-6742). A review that is not a gating run (a comment, a request for
    # changes, an outside approval, or an approval that route does not count) reports under another name,
    # so it cannot overwrite the gate. A PR reports the gate deferred when the queue is active, or runs
    # it on approval; the merge-group run executes the gate for the queued tree, and is green only when
    # the gate ran (or no package changed), never when route failed.
    name: ${{ (needs.route.result == 'skipped' || (github.event_name == 'pull_request_review' && needs.route.result == 'success' && needs.route.outputs.approved != 'true')) && 'e2e-gate (not a gating review)' || 'e2e-gate' }}
    # e2e-gate is the one required check, so it also fails when route, ruff-check, a package test job or the
    # e2e shards failed: a red unit test cannot merge on a green e2e, and a skipped gate is never green.
    needs: [route, validators, executor, miners, ruff-check, protocol, e2e-suites]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read          # the shards' artifacts
      pull-requests: write   # the sticky result comment (skipped on fork PRs, where the token is read-only)
    steps:
      - name: route, ruff-check, the package tests and the e2e shards passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: echo "::error::a package test job, ruff or an e2e shard failed (see tests-ok)" && exit 1
      - name: a gating run must route
        # route skips only a review that cannot gate; when it was supposed to run and did not, fail closed
        if: >-
          needs.route.result != 'success'
          && (github.event_name != 'pull_request_review'
          || (github.event.review.state == 'approved'
          && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR", "CONTRIBUTOR"]'), github.event.review.author_association)))
        run: echo "::error::route did not succeed (needs.route.result=${{ needs.route.result }})" && exit 1
      - name: a merge-group entry must have a route approval
        if: github.event_name == 'merge_group' && needs.route.outputs.approved != 'true'
        run: echo "::error::route did not approve the merge-group tree" && exit 1
      - name: the shards ran when the gate was expected
        if: needs.route.outputs.approved == 'true' && needs.route.outputs.e2e == 'true' && (github.event_name == 'merge_group' || vars.MERGE_QUEUE_ENABLED != 'true') && needs.e2e-suites.result != 'success'
        run: echo "::error::the e2e shards did not run (e2e-suites=${{ needs.e2e-suites.result }})" && exit 1
      - name: not a gating review
        if: needs.route.result == 'skipped'
        run: echo "this review cannot gate the tree; the last e2e-gate result stands"
      # With the queue off the PR check is the real gate: a green here would let an approved head merge
      # before the approval run reports, so fail closed instead.
      - name: not approved yet
        if: needs.route.result == 'success' && github.event_name != 'merge_group' && needs.route.outputs.approved != 'true'
        run: echo "the approval rule blocks the merge; e2e-gate reports after a review approves" && [ "${{ vars.MERGE_QUEUE_ENABLED }}" = "true" ]
      - name: deferred to the merge queue
        if: github.event_name != 'merge_group' && needs.route.outputs.approved == 'true' && vars.MERGE_QUEUE_ENABLED == 'true'
        run: echo "e2e gate runs in the merge queue for this tree"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: always() && needs.e2e-suites.result != 'skipped'
        continue-on-error: true
        with:
          pattern: e2e-*
          path: e2e/artifacts/shards
      - name: one summary from the shards
        if: always() && needs.e2e-suites.result != 'skipped'
        env:
          SHARDS_RESULT: ${{ needs.e2e-suites.result }}
          EXPECTED: ${{ needs.route.outputs.shards }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, sys
          root, out = pathlib.Path('e2e/artifacts/shards'), pathlib.Path('e2e/artifacts/summary.md')
          expected = json.loads(os.environ.get('EXPECTED') or '[]')
          out.parent.mkdir(parents=True, exist_ok=True)
          blocks, present = [], {}
          for d in sorted(p for p in root.glob('*') if p.is_dir()):
              md = d / 'summary.md'
              body = md.read_text().strip() if md.exists() else '**e2e gate: FAIL**: no summary written'
              first, _, rest = body.partition('\n')
              present[d.name.removeprefix('e2e-')] = 'PASS' in first
              t = d / 'timings.txt'
              suites = [l.split('\t')[0].removeprefix('test-') for l in t.read_text().splitlines() if l.startswith('test-')] if t.exists() else []
              blocks.append(f"### {' + '.join(suites) or d.name}\n\n{rest.strip()}\n")
          ok = sorted(present) == sorted(expected) and all(present.values()) and os.environ.get('SHARDS_RESULT') == 'success'
          out.write_text(('**e2e gate: PASS**' if ok else '**e2e gate: FAIL**') + '\n\n' + '\n'.join(blocks))
          print(out.read_text())
          if not ok:
              print(f"::error::e2e shards: expected {expected}, reported {sorted(present)}")
              sys.exit(1)
          PY
      - name: result on the PR
        if: always() && needs.e2e-suites.result != 'skipped' && github.event.pull_request && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          OUTCOME: ${{ needs.e2e-suites.result }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- e2e-gate -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const summary = fs.existsSync('e2e/artifacts/summary.md')
              ? fs.readFileSync('e2e/artifacts/summary.md', 'utf8')
              : `**e2e gate: FAIL** — no summary written: the shards did not finish (${process.env.OUTCOME}); see the run log.`;
            const body = [
              marker,
              `### e2e gate · ${context.payload.pull_request.head.sha.slice(0, 8)} · [run](${runUrl}) · [artifacts](${runUrl}#artifacts)`,
              '',
              summary.trim(),
              '',
              `<sub>Compose stack: the PR's executor + miner + validator services on one runner per shard, no chain, no GPU (e2e/README.md). Reproduce: \`make -C e2e e2e-full\`; on a GPU box: \`E2E_GPU=1 make -C e2e e2e-full\`.</sub>`,
            ].join('\n');
            // every page: on a PR with more than 100 comments a single page would miss the marker and post a second comment
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: context.issue.number, per_page: 100 });
            const mine = comments.find(c => c.body?.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
