name: "CD: Deploying Validator (dev) with Manual Trigger"

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dockerhub-push
    env:
      TAG: "dev" 
      TARGET_FILE: "docker-compose.app.dstacktee.dev.yml"
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub (OIDC, no stored token)
        uses: docker/login-action@v4   # >= 4.5.0 for Docker Hub OIDC
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
          # The exchanged token is the docker password for the rest of the job (default 300 s);
          # build+push here takes up to ~140 s, so 30 min leaves room for a cold cache or a slow runner.
          DOCKERHUB_OIDC_EXPIREIN: "1800"
        with:
          username: daturaai

      - name: Make scripts executable
        run: |
          chmod +x neurons/validators/docker_publish.sh
          chmod +x neurons/validators/docker_runner_publish.sh
          
      - name: Run docker_publish.sh
        run: |
          cd neurons/validators
          ./docker_publish.sh
          
      - name: Run docker_runner_publish.sh
        run: |
          cd neurons/validators
          ./docker_runner_publish.sh
