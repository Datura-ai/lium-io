name: "CD: Deploying Validator (dev) with Manual Trigger"

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dockerhub-push
    env:
      TAG: "dev" 
      TARGET_FILE: "docker-compose.app.dstacktee.dev.yml"
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Build before the login: the base images (python, docker) are public docker.io images, and once
      # the OIDC token is the docker.io credential every pull uses it. It covers only the daturaai push
      # repositories, so a build after the login fails with `insufficient scope`.
      - name: Build the images
        run: |
          cd neurons/validators
          bash ./docker_build.sh
          bash ./docker_runner_build.sh

      - name: Log in to Docker Hub (OIDC, no stored token)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0 (>= 4.5.0 for Docker Hub OIDC)
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
          # The exchanged token is the docker password for the rest of the job (default 300 s);
          # the pushes must finish inside it, so 30 min leaves room for a cold cache or a slow runner.
          DOCKERHUB_OIDC_EXPIREIN: "1800"
        with:
          username: daturaai

      - name: Push the images
        run: |
          docker push "daturaai/compute-subnet-validator:$TAG"
          docker push "daturaai/compute-subnet-validator-runner:$TAG"
