name: "CD: validator (prod)"

on:
  push:
    tags:
      - 'validator-v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TAG: "latest" 
      TARGET_FILE: "docker-compose.app.dstacktee.yml"
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub (OIDC, no stored token)
        uses: docker/login-action@v4   # >= 4.5.0 for Docker Hub OIDC
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
        with:
          username: daturaai

      - name: Make scripts executable
        run: |
          chmod +x neurons/validators/docker_publish.sh
          chmod +x neurons/validators/docker_runner_publish.sh
          
      - name: Run docker_publish.sh
        run: |
          cd neurons/validators
          ./docker_publish.sh
          
      - name: Run docker_runner_publish.sh
        run: |
          cd neurons/validators
          ./docker_runner_publish.sh
