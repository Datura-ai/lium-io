name: "CD: watchtower image"

# Builds watchtower/ and pushes daturaai/lium-watchtower:<tag> (and <tag>-staging).
# The executor compose files (neurons/executor/docker-compose*.yml) pull the updater by
# this version tag (DAH-3419), so the tag must be on Docker Hub before a compose change
# that names it merges. A manual run publishes the version the branch carries; a
# `watchtower-v<version>` tag publishes a release, the way `executor-v*` does for the
# executor (executor_cd_prod.yml). The moving tags `latest` and `staging` are not pushed
# here: the CVM stack pulls them, and a rebuild of those means a fleet-wide restart
# (watchtower/README.md).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to push; must equal project.version in watchtower/pyproject.toml"
        type: string
        default: "1.2.0"
        required: true
      push_staging:
        description: "Also build with the staging digest endpoint baked in and push <tag>-staging"
        type: boolean
        default: true
      overwrite:
        description: "Push over a tag that is already on Docker Hub (only to finish a run that failed halfway)"
        type: boolean
        default: false
  push:
    tags:
      - 'watchtower-v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: dockerhub-push
    # arm64 builds under QEMU on this x86 runner
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_REPOSITORY: daturaai/lium-watchtower
      # The staging backend signs the digest with this hotkey (lium-platform
      # apps/lium/backend/infrastructure/Pulumi.staging.yaml, DEFAULT_VALIDATOR_HOTKEY); it is
      # the hotkey the dev executor build trusts too (executor_cd_dev.yml).
      STAGING_ENDPOINT_URL: https://staging.lium.io/api/watchtower/digest
      STAGING_VALIDATOR_HOTKEY: "5DHgdomxxHSQf7neJWcagvGhTMKpqvKWwuprEaFF8C653qty"
      # One OCI index for x86 and ARM (GB300, GB10) hosts, as the executor (executor_cd_prod.yml):
      # docker_build.sh writes it to an OCI archive and the push steps copy it with skopeo.
      PLATFORMS: "linux/amd64,linux/arm64"

    steps:
      - uses: actions/checkout@v4

      - name: Resolve the tag and check it against watchtower/pyproject.toml
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PUSH_STAGING: ${{ inputs.push_staging }}
          INPUT_OVERWRITE: ${{ inputs.overwrite }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            TAG="${GITHUB_REF_NAME#watchtower-v}"
            PUSH_STAGING=true
            OVERWRITE=false
          else
            TAG="$INPUT_TAG"
            PUSH_STAGING="$INPUT_PUSH_STAGING"
            OVERWRITE="$INPUT_OVERWRITE"
          fi
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' watchtower/pyproject.toml)"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag '$TAG' is not the version in watchtower/pyproject.toml ('$VERSION'); bump the version or pass the matching tag"
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "push_staging=$PUSH_STAGING"
            echo "overwrite=$OVERWRITE"
          } >> "$GITHUB_OUTPUT"

      # pinned to reviewed commits: these run with id-token: write before the push
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          # the actions default to mutable tags (binfmt:latest, buildkit:buildx-stable-1); pin the images by digest
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      # Each build is one OCI archive (docker_build.sh, PLATFORMS set); only the version tag is pushed.
      # Build before the login: the base image (python) is a public docker.io image, and once the OIDC
      # token is the docker.io credential every pull uses it. It covers only the daturaai push
      # repositories, so a build after the login fails with `insufficient scope`.
      - name: Build the prod image
        env:
          DEPLOY_ENV: prod
          OCI_ARCHIVE: /tmp/lium-watchtower-prod.oci.tar
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          cd watchtower
          bash ./docker_build.sh

      - name: Build the staging image
        if: steps.tag.outputs.push_staging == 'true'
        env:
          DEPLOY_ENV: staging
          OCI_ARCHIVE: /tmp/lium-watchtower-staging.oci.tar
          WATCHTOWER_ENDPOINT_URL: ${{ env.STAGING_ENDPOINT_URL }}
          WATCHTOWER_VALIDATOR_HOTKEY: ${{ env.STAGING_VALIDATOR_HOTKEY }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          cd watchtower
          bash ./docker_build.sh

      - name: Log in to Docker Hub (OIDC, no stored token)
        uses: docker/login-action@v4   # >= 4.5.0 for Docker Hub OIDC
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
          # The exchanged token is the docker password for the rest of the job (default 300 s);
          # the pushes must finish inside it, so 30 min leaves room for a cold cache or a slow runner.
          DOCKERHUB_OIDC_EXPIREIN: "1800"
        with:
          username: daturaai

      # A version tag is pinned by the compose files and must not move: a mirror that cached
      # the first build would serve it for ever. The check reads Docker Hub before anything
      # is pushed. Only a "no such manifest" answer counts as absent: an auth, rate-limit or
      # network error fails the step instead of letting the tag be overwritten.
      - name: Refuse a tag that is already on Docker Hub
        if: steps.tag.outputs.overwrite != 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          PUSH_STAGING: ${{ steps.tag.outputs.push_staging }}
        run: |
          for ref in "$IMAGE_REPOSITORY:$TAG" $([ "$PUSH_STAGING" = "true" ] && echo "$IMAGE_REPOSITORY:$TAG-staging"); do
            if out=$(docker manifest inspect "$ref" 2>&1); then
              echo "::error::$ref is already on Docker Hub; bump the version, or re-run with overwrite to finish a failed run"
              exit 1
            fi
            if ! grep -qiE "no such manifest|manifest unknown" <<< "$out"; then
              echo "::error::could not check whether $ref is on Docker Hub: $out"
              exit 1
            fi
          done

      - name: Push the prod image
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: skopeo copy --all oci-archive:/tmp/lium-watchtower-prod.oci.tar "docker://docker.io/$IMAGE_REPOSITORY:$TAG"

      - name: Push the staging image
        if: steps.tag.outputs.push_staging == 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: skopeo copy --all oci-archive:/tmp/lium-watchtower-staging.oci.tar "docker://docker.io/$IMAGE_REPOSITORY:$TAG-staging"

      - name: Check the tags are on Docker Hub
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          PUSH_STAGING: ${{ steps.tag.outputs.push_staging }}
        run: |
          # each tag must list both platforms: an amd64-only tag cannot start on a GB300 or GB10 host
          for ref in "$IMAGE_REPOSITORY:$TAG" $([ "$PUSH_STAGING" = "true" ] && echo "$IMAGE_REPOSITORY:$TAG-staging"); do
            platforms=$(docker manifest inspect "$ref" | jq -r '[.manifests[]?.platform.architecture] | sort | join(",")')
            if [ "$platforms" != "amd64,arm64" ]; then
              echo "::error::$ref lists platforms '$platforms', not amd64,arm64"
              exit 1
            fi
            echo "published $ref ($platforms)"
          done
