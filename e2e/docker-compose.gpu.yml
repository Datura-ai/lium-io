# E2E_GPU=1 override (Makefile adds this file): the executor uses the HOST's dockerd and GPUs instead of the stack's
# GPU-less dind, exactly as a provider's executor does — host network, /var/run/docker.sock, `--gpus all`. Rental
# containers then run on the host daemon with real devices, and the scrape sees real GPUs. Meant for a GPU box or a
# Lium DinD pod (nested docker with the NVIDIA runtime); the other services stay on the compose network and reach the
# executor through the network gateway (E2E_EXECUTOR_IP=172.30.0.1, set by the Makefile and compose.sh when E2E_GPU is on) on
# E2E_EXECUTOR_SSH_PORT (stack.env: 2222 — the host's own sshd holds :22 on a Lium pod). The base file's `command:`
# makes sshd listen on that port (a sshd_config.d drop-in from SSH_PORT); with host networking there is no port map
# to do it. Not yet run on a GPU host (README); the CPU path is what CI proves, and it
# runs the same listener-follows-SSH_PORT mechanism on the same port.
# With host networking the executor's :8001 and sshd :2222 bind on every interface of the GPU host, the two hotkeys it
# trusts are public test-vector keys (stack.env) and the container holds the host's docker socket: run E2E_GPU=1 only on a
# box whose :8001/:2222 are not reachable from outside (a Lium pod's published ports, a firewalled dev box), never on a
# provider's production host.
services:
  dind:
    profiles: [cpu-only]   # not started
  executor:
    network_mode: host
    depends_on: !reset []
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      # merged by target with the base file's trust_anchor mount; the base's SSH_PORT/SSH_PUBLIC_PORT and `command:` carry over
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
