[project]
name = "lium-protocol"
version = "1.0.0"
description = "The Lium validator↔backend wire protocol: pydantic models, one JSON-schema snapshot, no application code"
authors = [
    {name = "Datura", email = "dev@datura.ai"},
]
dependencies = [
    "pydantic>=2.10,<3",
]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pdm.build]
includes = ["lium_protocol"]
source-includes = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
