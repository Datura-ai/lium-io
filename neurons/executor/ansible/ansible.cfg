[defaults]
inventory = inventory/localhost.yml
roles_path = roles
display_skipped_hosts = False

# stdout_callback is deliberately left at the built-in default.
#
# `yaml` is NOT shipped by ansible-core — `ansible-doc -t callback -l` lists only
# default, junit, minimal, oneline and tree. Setting it makes every run die with
# "Could not load 'yaml' callback plugin", and pulling it in would mean a
# collection dependency. That is the same trap as ansible.posix.profile_tasks:
# a plugin that feels built-in but is not.
interpreter_python = auto_silent
retry_files_enabled = False


# `become` is deliberately NOT set here. It is declared per play in site.yml so
# that a play which does not need root does not silently acquire it. The
# `common` play sets it explicitly because the decisive facts require root
# (pckcache.db, `ss --vsock`, nvtrust, the key-provider docker inspects).

# Collections required: none. Every module used is ansible.builtin.* and every
# filter is a core builtin, so `pip install ansible-core` is a complete install.
# If a future change needs a collection it must arrive with a
# collections/requirements.yml installed via `ansible-galaxy collection install -r`
# in BOTH bootstrap.sh and CI — pip cannot install collections.
