---
# Copy to a file OUTSIDE the repo and pass it with:
#   sudo ./bootstrap.sh --vars-file /root/lium-cvm-secrets.yml
#
# Do not commit a filled-in copy. Nothing here is required for a first run: with
# both values unset the sgx_key_provider role takes its DEGRADED path — no local
# PCCS, no in-band registration, both QPL configs pointed at lium_pccs_url — and
# verify reports sgx.registration_pck_certs as SKIPPED with the remediation.

# Intel PCS API subscription key. Account-level and legitimately shared across a
# fleet. There is no distribution channel for it today; it is copied by hand from
# a peer host's /opt/intel/sgx-dcap-pccs/config/default.json.
lium_intel_api_key: ""

# Token the local PCCS requires on its /platforms endpoint. PCCS config stores
# only the SHA512 hash, so pick your own on a fresh host.
lium_pccs_user_token: ""

# Point this at a remote PCCS to run without a local one.
lium_pccs_url: "https://localhost:8081/sgx/certification/v4/"
