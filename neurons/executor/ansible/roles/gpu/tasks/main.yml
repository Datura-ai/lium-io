---
# GPU confidential-compute mode and vfio binding. DESTRUCTIVE — flipping CC mode
# resets every GPU it touches.
#
# CC mode is OFF by default. That was true on au1 AND au2, two freshly
# provisioned hosts, so treat it as the expected state of any new host — not as
# an accident.
#
# Retracted belief, kept because a wrong belief costs time twice:
# ENABLE_GPU_ATTESTATION=false does NOT make CC mode optional. That flag only
# controls whether the executor EMITS GPU attestation evidence. CC mode is a
# hardware prerequisite for GPU passthrough into a TDX guest, independent of it.

- name: Guard against converging over an existing CVM
  ansible.builtin.include_role:
    name: common
    tasks_from: assert_no_cvm
  vars:
    common_guard_reason: GPU CC-mode flip resets every GPU
    common_guard_override_var: lium_force_gpu_cc

- name: Skip the GPU role when no CC-capable device is present
  ansible.builtin.debug:
    msg: >-
      No CC-capable GPU found on this host, so there is nothing to converge.
      Searched PCI ids: {{ lium_cc_gpu_pci_ids | join(', ') }}.
  when: (lium.gpu_bdfs | default([]) | length) == 0

- name: End the role when there are no GPUs
  ansible.builtin.meta: end_role
  when: (lium.gpu_bdfs | default([]) | length) == 0

# Tri-state. Never flip a mode we could not read: the flip resets the GPU, and a
# query that failed is not the same as a query that said "off".
- name: Refuse to act on an unreadable CC mode
  ansible.builtin.fail:
    msg: |
      REFUSING: the confidential-compute mode of {{ lium_unreadable_cc | length }}
      GPU(s) could not be read, and flipping a mode we cannot read resets a GPU
      for no reason we can justify.

      {% for bdf, entry in lium.gpu_cc_mode.items() %}
      {% if not entry.readable %}
        {{ bdf }}: {{ entry.reason }}
      {% endif %}
      {% endfor %}

      Install or repair nvtrust first, then re-run.
  vars:
    lium_unreadable_cc: >-
      {{ lium.gpu_cc_mode | dict2items | rejectattr('value.readable') | list }}
  when: lium_unreadable_cc | length > 0

# Cloned to /opt and symlinked to /root/nvtrust, because the cvm-provision
# skill's preflight.sh:78 and fix-host.sh:159 hardcode
# /root/nvtrust/host_tools/python/nvidia_gpu_tools.py. Both keep working.
- name: Install nvtrust at the pinned tag
  ansible.builtin.git:
    repo: "{{ lium_nvtrust_repo }}"
    dest: "{{ lium_nvtrust_dir }}"
    version: "{{ lium_nvtrust_tag }}"
    recursive: true
    depth: 1
    update: false

- name: Symlink /root/nvtrust for the existing provisioning scripts
  ansible.builtin.file:
    src: "{{ lium_nvtrust_dir }}"
    dest: /root/nvtrust
    state: link
    force: true

- name: Flip confidential-compute mode where it is off
  ansible.builtin.include_tasks: flip_cc.yml
  loop: "{{ lium_cc_off_bdfs }}"
  loop_control:
    loop_var: lium_gpu_bdf
  vars:
    lium_cc_off_bdfs: >-
      {{ lium.gpu_cc_mode | dict2items
         | selectattr('value.readable')
         | selectattr('value.value', 'equalto', 'off')
         | map(attribute='key') | list }}

# Every device, GPUs and NVSwitches alike. A GPU bound to vfio-pci while its
# NVSwitch is not gets you a guest that boots and then cannot see NVLink.
- name: Bind every device to vfio-pci
  ansible.builtin.include_tasks: rebind.yml
  loop: "{{ (lium.gpu_bdfs | default([])) + (lium.nvswitch_bdfs | default([])) }}"
  loop_control:
    loop_var: lium_gpu_bdf

- name: Report the GPU inventory
  ansible.builtin.debug:
    msg: >-
      {{ lium.gpu_bdfs | length }} GPU(s) and {{ lium.nvswitch_bdfs | length }}
      NVSwitch(es) bound to vfio-pci.
