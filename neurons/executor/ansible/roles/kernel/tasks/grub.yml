---
# render -> union -> write -> grub.cfg assertion -> drift.
#
# Every step here is driven through a seam so the whole chain runs end to end in
# CI against a fixture root, without a real bootloader.

- name: Build the required token set
  ansible.builtin.set_fact:
    lium_required_tokens: >-
      {{
        ['kvm_intel.tdx=on', 'intel_iommu=on', 'iommu=pt', 'nohibernate']
        + (
            ['vfio-pci.ids=' ~ (lium.present_pci_ids | join(','))]
            if (lium.present_pci_ids | length) > 0 else []
          )
        + ['vfio_iommu_type1.dma_entry_limit=' ~ lium_dma_entry_limit]
      }}

# The PROVIDER's own shape, with our drop-in excluded.
#
# This has to be a separate analysis, and it has to exclude our own file.
# Once the drop-in has appended the full required set to _DEFAULT, every token
# is in both lines and the au2 shape — arguments in GRUB_CMDLINE_LINUX with
# _DEFAULT empty — is masked by our own fix. Asking the post-write view would
# report the shape on run 1 and silently stop reporting it on run 2.
- name: Analyse the provider's own GRUB configuration
  ansible.builtin.command:
    cmd: >-
      {{ lium_common_files }}/lium-cmdline.sh analyze
      --required {{ lium_required_tokens | join(' ') | quote }}
      --grub-default {{ lium_grub_default_path | quote }}
      --grub-dropin-dir {{ lium_grub_dropin_path | dirname | quote }}
      --exclude-dropin {{ lium_grub_dropin_path | quote }}
      --proc-cmdline {{ lium_proc_cmdline_path | quote }}
  register: lium_cmdline_before_raw
  changed_when: false
  check_mode: false

- name: Publish the provider's own configuration
  ansible.builtin.set_fact:
    lium_cmdline_before: "{{ lium_cmdline_before_raw.stdout | from_json }}"

# `vfio-pci.ids=` MAY ONLY WIDEN.
#
# If a device is hot-removed or wedged it disappears from lspci, the freshly
# discovered set gets shorter, and writing that shorter list unbinds a GPU on
# the next boot. Refuse and name the missing ids instead.
#
# The comparison unions TWO sources — see the vars below. Neither alone is
# enough, and each covers the other's blind spot.
- name: Refuse to narrow vfio-pci.ids
  ansible.builtin.fail:
    msg: |
      REFUSING: the vfio-pci id list would get SHORTER.

      Already on the kernel command line or in GRUB : {{ lium_vfio_ids_existing | join(', ') }}
      Discovered on this host right now             : {{ lium.present_pci_ids | join(', ') }}
      Would be dropped                              : {{ lium_vfio_ids_dropped | join(', ') }}

      A device that is hot-removed or wedged disappears from lspci. Writing the
      shorter list would unbind it on the next boot. Bring it back first:

          echo 1 | sudo tee /sys/bus/pci/rescan

      then re-run. If the device is genuinely gone for good, remove its id from
      GRUB by hand so the two agree.
  vars:
    # BOTH sources, unioned.
    #
    # lium_cmdline_before EXCLUDES our own drop-in (so the au2 shape stays
    # reportable across re-runs) and INCLUDES /proc/cmdline. lium.* includes the
    # drop-in but not /proc/cmdline. Either alone leaves a hole:
    #   - without lium.*, ids that live only in a drop-in we wrote on a previous
    #     run are invisible, so a run-2 with a wedged GPU quietly shortens the
    #     list;
    #   - without the analysis, ids the host BOOTED with but which were later
    #     cleaned out of the GRUB files are invisible.
    # Unioning cannot cause a false refusal: a legitimately added GPU only ever
    # widens the discovered set, so the difference stays empty.
    lium_vfio_ids_existing: >-
      {{ lium_cmdline_before.existing_vfio_ids | union(lium.grub_existing_vfio_ids) }}
    lium_vfio_ids_dropped: >-
      {{ lium_vfio_ids_existing | difference(lium.present_pci_ids) }}
  when: lium_vfio_ids_dropped | length > 0

# Once, and never overwritten: the point of a backup is the state BEFORE the
# first change, not before the most recent one.
- name: Back up the provider's GRUB defaults
  ansible.builtin.copy:
    src: "{{ lium_grub_default_path }}"
    dest: "{{ lium_grub_default_path }}.bak.pre-lium-cvm"
    remote_src: true
    force: false
    mode: "0644"

- name: Ensure the GRUB drop-in directory exists
  ansible.builtin.file:
    path: "{{ lium_grub_dropin_path | dirname }}"
    state: directory
    mode: "0755"

- name: Write the append-only GRUB drop-in
  ansible.builtin.template:
    src: 99-lium-cvm.cfg.j2
    dest: "{{ lium_grub_dropin_path }}"
    mode: "0644"
  register: lium_grub_dropin

- name: Check whether a bootloader configuration exists at all
  ansible.builtin.stat:
    path: "{{ lium_grubcfg_path }}"
  register: lium_grubcfg_stat

- name: Regenerate the bootloader configuration
  ansible.builtin.command:
    cmd: "{{ lium_update_grub_cmd }}"
  register: lium_update_grub_result
  changed_when: lium_update_grub_result.rc == 0
  # Also when grub.cfg is absent: on a re-run where the drop-in is byte-identical
  # but a previous regeneration never succeeded, gating on `changed` alone would
  # never retry, and the assertion below would then have nothing to read.
  when: lium_grub_dropin.changed or not (lium_grubcfg_stat.stat.exists | default(false))

# THE DECISIVE CHECK, and it runs before a reboot is even offered.
#
# A merge failure caught here is still trivially recoverable — restore
# /etc/default/grub.bak.pre-lium-cvm; nothing has rebooted. Caught after the
# reboot, the host comes back looking healthy while attestation silently fails.
- name: Analyse the merged command line against the generated grub.cfg
  ansible.builtin.command:
    cmd: >-
      {{ lium_common_files }}/lium-cmdline.sh analyze
      --required {{ lium_required_tokens | join(' ') | quote }}
      --grub-default {{ lium_grub_default_path | quote }}
      --grub-dropin-dir {{ lium_grub_dropin_path | dirname | quote }}
      --proc-cmdline {{ lium_proc_cmdline_path | quote }}
      --grubcfg {{ lium_grubcfg_path | quote }}
  register: lium_cmdline_raw
  changed_when: false
  check_mode: false

- name: Publish the command-line analysis
  ansible.builtin.set_fact:
    lium_cmdline: "{{ lium_cmdline_raw.stdout | from_json }}"

- name: Assert every required token wins in the generated grub.cfg
  ansible.builtin.assert:
    that:
      # Presence is part of the assertion, NOT a condition on it. Gating on
      # grubcfg_present made this fail OPEN in the one case it exists for: a
      # full /boot, where update-grub writes nothing, no linux line can be
      # parsed, the check is skipped, drift is still non-empty — and the host
      # reboots into a configuration nobody verified.
      - lium_cmdline.grubcfg_present | bool
      - lium_cmdline.grubcfg_missing_tokens | length == 0
    fail_msg: |
      The generated bootloader configuration does NOT resolve every required token,
      or could not be read at all. Refusing to reboot into it.

      grub.cfg readable     : {{ lium_cmdline.grubcfg_present }}
      Missing or overridden : {{ lium_cmdline.grubcfg_missing_tokens | join(', ') }}
      grub.cfg linux line   : {{ lium_cmdline.grubcfg_linux_line }}
      GRUB_CMDLINE_LINUX    : {{ lium_cmdline.grub_cmdline_linux }}
      ..._LINUX_DEFAULT     : {{ lium_cmdline.grub_cmdline_linux_default }}

      Nothing has rebooted, so this is still easy to undo:
          sudo cp {{ lium_grub_default_path }}.bak.pre-lium-cvm {{ lium_grub_default_path }}
    success_msg: "Every required token resolves correctly in the generated grub.cfg."
    quiet: true

- name: Record the running kernel's drift
  ansible.builtin.set_fact:
    lium_kernel_drift: "{{ lium_cmdline.drift_tokens }}"

- name: Warn about stale conflicting tokens
  ansible.builtin.debug:
    msg: |
      These keys appear more than once with DIFFERENT values across the GRUB
      lines: {{ lium_cmdline.conflicting_keys | join(', ') }}

      Our values win, because /etc/grub.d/10_linux emits GRUB_CMDLINE_LINUX before
      GRUB_CMDLINE_LINUX_DEFAULT and the kernel takes the last occurrence. But
      relying on that ordering forever is fragile — remove the stale copies from
      {{ lium_grub_default_path }}.
  when: lium_cmdline.conflicting_keys | length > 0

- name: Report tokens the provider kept only in GRUB_CMDLINE_LINUX
  ansible.builtin.debug:
    msg: >-
      Present only in GRUB_CMDLINE_LINUX, not in GRUB_CMDLINE_LINUX_DEFAULT:
      {{ lium_cmdline_before.found_only_in_grub_cmdline_linux | join(', ') }}.
      This is the au2 shape. It resolves correctly; it is recorded because a
      naive edit of the wrong variable is what silently drops kvm_intel.tdx.
  when: lium_cmdline_before.found_only_in_grub_cmdline_linux | length > 0
