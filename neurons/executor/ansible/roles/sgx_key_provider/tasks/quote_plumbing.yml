---
# The two fresh-install defaults that each make a CVM reboot at ~160-190 seconds
# instead of booting.
#
# The guest fetches its TD report via TSM, sends it over vhost-vsock to the host
# to be turned into a quote, presents that to the key provider for the sealing
# key, and unseals its data disk. Any failure in that chain fails
# dstack-prepare, and the guest reboots. A GPU-clean boot that still reboots is
# almost always one of these two.

# 10a. qgsd ships with `#port = 4050` COMMENTED OUT, so it serves over a unix
# socket, reports `active`, and never answers the guest.
# Signature: `vsock failure: Connection reset by peer (os error 104)`.
- name: Serve TD quotes over vsock
  ansible.builtin.lineinfile:
    path: /etc/qgs.conf
    regexp: '^\s*#?\s*port\s*='
    line: "port = 4050"
    create: false
    mode: "0644"
  register: lium_qgs_conf
  notify: Restart qgsd

- name: Apply the qgsd change now
  ansible.builtin.meta: flush_handlers

- name: Confirm qgsd is listening on vsock 4050
  ansible.builtin.command:
    cmd: ss -a --vsock
  register: lium_vsock
  changed_when: false
  failed_when: false
  # Reading a listener list changes nothing, and check mode skips command tasks
  # unconditionally — which would leave this register with no stdout at all.
  check_mode: false

- name: Assert the vsock listener exists
  ansible.builtin.assert:
    that:
      - "'4050' in lium_vsock.stdout"
    fail_msg: >-
      qgsd is not listening on vsock port 4050, so the guest cannot get a TD
      quote and will reboot at around 160 seconds with
      "vsock failure: Connection reset by peer (os error 104)".
      Check `systemctl status qgsd` and /etc/qgs.conf.
    quiet: true
  when:
    - lium_assert_vsock | bool
    # A check run never applied the `port = 4050` line above and never fired the
    # qgsd restart, so a failure here would only describe the host as it was
    # BEFORE the fix this very run is proposing. On a healthy host it aborted
    # `--check` outright — killing the run before the verify report exists,
    # which is the one artefact a report-only run is for.
    - not ansible_check_mode

# 10b. The system QPL config ships "use_secure_cert": true, which verifies the
# PCCS TLS certificate — and a local PCCS uses a self-signed one.
# Signature: `[QCNL] CURL error: (60) SSL peer certificate ... was not OK`,
# `[QPL] Failed to get quote config. Error code is 0xb033`, then
# `vsock failure: failed to fill whole buffer`.
#
# The file is WRITTEN, not line-edited. Two `lineinfile` tasks used to do this
# and they corrupted Intel's shipped config into invalid JSON — the template
# header explains exactly how. Keep the pristine copy first: it is the only
# record of what the platform shipped with.
- name: Look for an existing system QPL configuration
  ansible.builtin.stat:
    path: "{{ lium_system_qcnl_path }}"
  register: lium_system_qcnl_stat

# force: false, so the backup is taken ONCE. Re-running must not overwrite the
# pristine copy with the managed one — that would destroy the only record of
# what the platform shipped with, on the second converge, silently.
- name: Preserve the pristine system QPL configuration
  ansible.builtin.copy:
    src: "{{ lium_system_qcnl_path }}"
    dest: "{{ lium_system_qcnl_path }}.pre-lium-cvm"
    remote_src: true
    force: false
    mode: "0644"
  when: lium_system_qcnl_stat.stat.exists | default(false)

- name: Write the system QPL configuration
  ansible.builtin.template:
    src: sgx_default_qcnl.conf.j2
    dest: "{{ lium_system_qcnl_path }}"
    mode: "0644"
    # Refuse to install a file the QPL cannot read. Without this the corruption
    # is silent on the host and only surfaces as a CVM that reboots at ~160s,
    # three layers away, long after the converge reported success.
    validate: "python3 -c \"import json,sys; json.load(open(sys.argv[1]))\" %s"
  notify: Restart qgsd
