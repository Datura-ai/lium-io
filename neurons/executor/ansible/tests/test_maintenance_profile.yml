---
# The maintenance profile must ROUTE, not abort.
#
# On a host that already has a CVM, `bootstrap.sh` adds `--skip-tags
# destructive`. That must withhold kernel, gpu and qemu while still converging
# everything else — including reaching `verify` and emitting a report.
#
# WHY THIS TEST EXISTS
# --------------------
# The tags in site.yml are declared at PLAY level. Play-level tags are inherited
# by that play's `pre_tasks`; ROLE-ENTRY tags are not. If `destructive` were
# declared on the role entry instead, `--skip-tags destructive` would skip the
# role but STILL RUN the guard pre_tasks — so every maintenance run on every host
# that has ever created a CVM would abort on the guard it was supposed to be
# routing around. It fails safe and loud, but it fails on 100% of maintenance
# runs, and nothing before the hardware acceptance run would catch it.
#
# THE ASSERTION IS POSITIVE, ON PURPOSE
# -------------------------------------
# It asserts the play REACHED verify and produced a report saying DORMANT. It
# does NOT assert "no error occurred": a run that aborts in the guard pre_tasks
# and a run that finishes correctly are BOTH non-zero here, because verify exits
# non-zero on a host full of MUST_FIX checks. Only the report tells them apart.

- name: Maintenance profile routes rather than aborts
  hosts: localhost
  gather_facts: false
  vars:
    maint_work: /tmp/lium-maint
    maint_state: /tmp/lium-maint/state
    maint_report: /tmp/lium-maint/state/verify-report.json

  tasks:
    - name: Start from a clean state directory
      ansible.builtin.file:
        path: "{{ maint_work }}"
        state: absent

    - name: Provide an empty proc root
      ansible.builtin.file:
        path: "{{ playbook_dir }}/fixtures/emptyproc"
        state: directory
        mode: "0755"

    # Run the REAL site.yml as a child process, exactly as bootstrap.sh would in
    # maintenance mode. Anything less would test a copy of the tag design rather
    # than the tag design.
    - name: Run site.yml with the maintenance profile against a DORMANT fixture
      ansible.builtin.command:
        cmd: >-
          ansible-playbook -i {{ playbook_dir }}/../inventory/localhost.yml
          {{ playbook_dir }}/../site.yml
          --skip-tags destructive
          -e ansible_become=false
          -e lium_test_mode=true
          -e lium_preflight_fatal=false
          -e lium_state_dir={{ maint_state }}
          -e lium_log_dir={{ maint_work }}/log
          -e lium_repo_path={{ maint_work }}/no-such-repo
          -e lium_repo_clone=false
          -e lium_sgx_install=false
          -e lium_start_key_provider=false
          -e '{"lium_hda_search_roots": ["{{ playbook_dir }}/fixtures/guard/dormant_hda"]}'
          -e lium_proc_root={{ playbook_dir }}/fixtures/emptyproc
        chdir: "{{ playbook_dir }}/.."
      environment:
        ANSIBLE_LIUM_TEST: "1"
        ANSIBLE_CONFIG: "{{ playbook_dir }}/../ansible.cfg"
      register: maint_run
      changed_when: true
      failed_when: false

    # POSITIVE assertion 1: the play reached verify at all.
    - name: The report must exist
      ansible.builtin.stat:
        path: "{{ maint_report }}"
      register: maint_report_stat

    - name: The maintenance run reached the verify role
      ansible.builtin.assert:
        that:
          - maint_report_stat.stat.exists
        fail_msg: |
          No verify report at {{ maint_report }}, so the play never reached the
          verify role.

          The most likely cause is that a `destructive` tag was declared on a ROLE
          ENTRY rather than at PLAY level in site.yml. Role-entry tags are not
          inherited by pre_tasks, so --skip-tags destructive skips the role but
          still runs the guard, which then aborts on the DORMANT fixture.

          Child run output (last lines):
          {{ maint_run.stdout_lines[-25:] | default([]) | join('\n') }}
        quiet: true

    - name: Read the report
      ansible.builtin.slurp:
        src: "{{ maint_report }}"
      register: maint_report_raw

    # POSITIVE assertion 2: it reached verify HAVING SEEN the dormant host.
    - name: The report records the DORMANT guard state
      ansible.builtin.assert:
        that:
          - maint_guard_check | length == 1
          - maint_guard_check[0].observed is search('DORMANT')
        fail_msg: >-
          The report exists but guard.host_state does not say DORMANT
          ({{ maint_guard_check | map(attribute='observed') | list }}). The
          fixture was not seen, so this run proves nothing about the maintenance
          profile.
        quiet: true
      vars:
        maint_guard_check: >-
          {{ (maint_report_raw.content | b64decode | from_json).checks
             | selectattr('id', 'equalto', 'guard.host_state') | list }}

    # And the withholding actually happened: the destructive roles must not have
    # run. Asserted from the child's own output.
    - name: The destructive roles were withheld
      ansible.builtin.assert:
        that:
          - "'TASK [kernel :' not in maint_run.stdout"
          - "'TASK [gpu :' not in maint_run.stdout"
          - "'TASK [qemu :' not in maint_run.stdout"
        fail_msg: >-
          A destructive role ran under --skip-tags destructive. The tag is not
          doing its job.
        quiet: true

    # And the SAFE roles did run — otherwise the profile would be audit-only,
    # which is strictly less useful than having no maintenance mode at all.
    - name: The safe roles still converged
      ansible.builtin.assert:
        that:
          - "'TASK [repo :' in maint_run.stdout or 'repo' in maint_report_text"
          - "'TASK [verify :' in maint_run.stdout"
        fail_msg: >-
          Maintenance mode reached verify but skipped the safe roles, which makes
          it audit-only. --skip-tags destructive must withhold ONLY kernel, gpu
          and qemu.
        quiet: true
      vars:
        maint_report_text: "{{ maint_report_raw.content | b64decode }}"

    - name: PASS
      ansible.builtin.debug:
        msg: >-
          PASS maintenance profile — --skip-tags destructive on a DORMANT host
          withheld kernel/gpu/qemu, converged the rest, and reached verify.
