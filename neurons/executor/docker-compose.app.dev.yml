services:
  executor:
    image: daturaai/compute-subnet-executor:dev
    env_file: ./.env
    restart: always
    ports:
      - ${EXTERNAL_PORT}:${INTERNAL_PORT}
      - ${SSH_PORT}:22
    expose:
      - ${INTERNAL_PORT}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/docker/daemon.json:/etc/docker/daemon.json
      - /etc/nvidia-container-runtime/config.toml:/etc/nvidia-container-runtime/config.toml
      - reserve_data:/var/lium-reserve
      - pod_logs:/var/lib/executor-pod-logs
    pid: host
    privileged: true
    # A renter's workload gets the whole host's cores and nearly all its RAM, with nothing reserved
    # for the executor. Under full renter load the executor must keep answering /version and sshd or
    # the validator reads the node as offline mid-rental and penalises the provider. Bias the CPU to
    # the executor under contention (the renter keeps full cores while the executor is idle), keep a
    # small RAM reservation, and tell the kernel OOM killer to spare it.
    cpu_shares: 4096
    mem_reservation: 2g
    oom_score_adj: -900
    environment:
      - NVIDIA_DRIVER_CAPABILITIES=all
    labels:
      autoheal: true
    healthcheck:
      # probe the app itself on the loopback (no docker networking involved):
      # a wedged agent goes unhealthy and autoheal restarts it, while nvidia-smi
      # only proved the GPU driver was alive. Conservative thresholds so a
      # host-IO storm (~2.5 min of continuous failure needed) cannot trigger
      # false restarts.
      test: [ "CMD-SHELL", "curl -fsS --max-time 5 http://127.0.0.1:${INTERNAL_PORT}/version || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

  monitor:
    image: daturaai/compute-subnet-executor:latest
    env_file: ./.env
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /dev/kmsg:/dev/kmsg:ro
      - pod_logs:/var/lib/executor-pod-logs
    pid: host
    command: pdm run src/monitor.py
    oom_score_adj: -900
    depends_on:
      - executor

  autoheal:
    restart: always
    image: willfarrell/autoheal
    # autoheal is what restarts a wedged executor, so it must itself survive a host OOM.
    oom_score_adj: -900
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  reserve_data:
  pod_logs:
