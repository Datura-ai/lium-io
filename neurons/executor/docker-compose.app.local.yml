services:
  executor:
    build:
      context: .
      additional_contexts:
        datura: ../../datura
        liumd: ./liumd
    image: compute-subnet-executor:local
    env_file: ./.env
    restart: always
    ports:
      - ${EXTERNAL_PORT}:${INTERNAL_PORT}
      - ${SSH_PORT}:22
    expose:
      - ${INTERNAL_PORT}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/docker/daemon.json:/etc/docker/daemon.json
      - /etc/nvidia-container-runtime/config.toml:/etc/nvidia-container-runtime/config.toml
      - reserve_data:/var/lium-reserve
      - pod_logs:/var/lib/executor-pod-logs
    pid: host
    privileged: true
    environment:
      - NVIDIA_DRIVER_CAPABILITIES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

  monitor:
    image: compute-subnet-executor:local
    env_file: ./.env
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /dev/kmsg:/dev/kmsg:ro
      - pod_logs:/var/lib/executor-pod-logs
    pid: host
    command: pdm run src/monitor.py
    depends_on:
      - executor

volumes:
  reserve_data:
  pod_logs:
