version: '3.7'

services:
  executor-runner:
    image: daturaai/compute-subnet-executor-runner:dev
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - "$HOME/.bittensor/wallets:/root/.bittensor/wallets"
      - ./.env:/root/executor/.env

  # Same updater as docker-compose.yml (DAH-3419); see the comment there. The `-staging`
  # build has the staging digest endpoint baked in, which signs the `dev` runner.
  watchtower:
    image: daturaai/lium-watchtower:1.1.0-staging
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
