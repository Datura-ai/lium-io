version: '3.7'

services:
  lium-watchtower:
    image: daturaai/lium-watchtower@sha256:06f6a369aca55a41afc2a6c37f962d3766496635b5b0924f51685e0af9829e16
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.env:/app/.env
    environment:
      - WATCHTOWER_ENABLED=true
      - WATCHTOWER_IMAGE=daturaai/compute-subnet-executor-runner
      - WATCHTOWER_INTERVAL=300
      - WATCHTOWER_ENDPOINT_URL=https://validator.lium.io/api/digest
      - WATCHTOWER_VALIDATOR_HOTKEY=5F7X5UpKSr26KU3jKfpLmT8kuKtBNyHhEnfS8xtxPCqCb13p
      - WATCHTOWER_ENV_FILE_PATH=${PWD}/.env
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
