# Appended to /etc/ssh/sshd_config at image build (Dockerfile, DAH-3522). Everything below the
# Match line applies to the `liumuser` account only, so it must stay the last block of the file:
# sshd_setup.sh's drop-in goes through the top-of-file Include for that reason.
#
# The account exists for the platform's web terminal: a session names the renter's pod in
# CONTAINER_NAME and the forced command opens a shell in that pod, nothing else. The forced
# command (liumuser_shell.sh) refuses any name that is not pod_<uuid>. The directives below
# close the paths around it: no port, unix-socket, agent or X11 forwarding (the executor
# container holds the host Docker socket), no tunnels, no ~/.ssh/rc, keys only.
AcceptEnv CONTAINER_NAME
Match User liumuser
    ForceCommand /usr/local/bin/lium-pod-shell
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PermitEmptyPasswords no
    DisableForwarding yes
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTunnel no
    PermitUserRC no
    PermitTTY yes
