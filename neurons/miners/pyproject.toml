[project]
name = "miners"
version = "3.0.0"
description = "Compute subnet miner"
authors = [
    {name = "waris", email = "waris0609@outlook.com"},
]
dependencies = [
    "alembic>=1.16.5",
    "asyncssh>=2.21.0",
    "asgiref>=3.9.1",
    "bittensor==10.5.0",
    "async-substrate-interface>=2.0.4",
    "bittensor-cli>=9.22.0",
    "bittensor-commit-reveal>=0.4.0",
    "celium-collateral==1.2.0",
    "databases>=0.9.0",
    "datura @ file:///${PROJECT_ROOT}/../../datura",
    "fastapi>=0.110.3",
    "lium-core>=0.1.1",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "python-json-logger>=3.3.0",
    "psycopg2-binary>=2.9.10",
    "SQLAlchemy>=2.0.43",
    "sqlmodel>=0.0.24",
    "tenacity>=9.1.2",
    "uvicorn>=0.35.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=0.24.0",
]
requires-python = "<3.13,>=3.11"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm]
distribution = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
